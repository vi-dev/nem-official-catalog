name: Smoke

on:
  schedule:
    - cron: "0 6 * * 2" # Tuesdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Install every package at latest
        shell: bash
        run: |
          for d in pkgs/*/; do basename "$d"; done \
            | .github/scripts/install-each.sh
