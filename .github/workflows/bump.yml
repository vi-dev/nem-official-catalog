name: Bump

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated package names to bump (empty = every outdated package)
        default: ""

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require app credentials
        shell: bash
        env:
          HAVE_APP: ${{ secrets.BUMP_APP_CLIENT_ID != '' && secrets.BUMP_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAVE_APP" != "true" ]; then
            echo "::error::BUMP_APP_CLIENT_ID and BUMP_APP_PRIVATE_KEY are missing; GitHub signs API commits only for app tokens, and a non-Actions token is what makes pull_request CI run on bump PRs"
            exit 1
          fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup-nem
      - name: Open bump PRs
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          warn() { echo "WARN: $*" >> "$GITHUB_STEP_SUMMARY"; }

          # main rejects unsigned commits; GitHub signs API commits from a bot token.
          commit_signed() {
            local name=$1 path=$2 head=$3 base blob
            base=$(git rev-parse origin/main)
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/bump/$name" \
              -f sha="$base" -F force=true >/dev/null 2>&1 \
              || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                   -f ref="refs/heads/bump/$name" -f sha="$base" >/dev/null \
              || return 1
            blob=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=bump/$name" --jq .sha) \
              || return 1
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f branch="bump/$name" \
              -f message="feat: bump $name to $head" \
              -f sha="$blob" \
              -f content="$(base64 -w0 "$path")" >/dev/null
          }

          git fetch origin 'refs/heads/bump/*:refs/remotes/origin/bump/*'

          nem catalog outdated . --json > /tmp/outdated.json
          {
            echo "### Outdated and errored packages"
            echo '```json'
            jq '[.[] | select(.outdated or .error != null)]' /tmp/outdated.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          readarray -t names < <(jq -r --arg only "$PACKAGES" '
            [.[] | select(.outdated)]
            | (if $only == "" then . else
                ($only | split(" ")) as $want
                | [.[] | select(.name as $n | $want | index($n))]
              end)
            | .[].name' /tmp/outdated.json)

          for name in "${names[@]}"; do
            path="pkgs/$name/pkg.yaml"
            git switch --quiet --force-create "bump/$name" origin/main
            if ! nem catalog bump "$path"; then
              warn "bump failed for $name; next scheduled run retries"
              continue
            fi
            head=$(yq -r '.versions[0].version // .versions[0]' "$path")
            current=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .current' /tmp/outdated.json)
            if git diff --quiet HEAD -- "$path"; then
              warn "bump produced no change for $name"
              continue
            fi

            # An unsigned tip needs rewriting even when the content matches.
            fresh=false
            if git rev-parse --verify --quiet "origin/bump/$name" >/dev/null \
              && git diff --quiet "origin/bump/$name" -- "$path"; then
              verified=$(gh api "repos/$GITHUB_REPOSITORY/commits/bump/$name" \
                --jq '.commit.verification.verified' 2>/dev/null) || verified=false
              if [ "$verified" = "true" ]; then
                fresh=true
              fi
            fi

            if [ "$fresh" = true ]; then
              echo "bump/$name already up to date; not re-committing"
            elif ! commit_signed "$name" "$path" "$head"; then
              warn "commit failed for $name; next scheduled run retries"
              continue
            fi

            if ! open=$(gh pr list --head "bump/$name" --state open --json number --jq 'length'); then
              warn "PR lookup failed for $name"
              continue
            fi
            if [ "$open" = 0 ]; then
              body="Bump \`$name\` $current → $head."
              repo=$(yq -r '.versionDiscovery.github.repo // ""' "$path")
              if [ -n "$repo" ]; then
                body+=$'\n\n'"Upstream releases: https://github.com/$repo/releases"
              fi
              if ! gh pr create --head "bump/$name" --base main \
                --title "feat: bump $name to $head" --body "$body"; then
                warn "PR creation failed for $name"
                continue
              fi
            fi
          done

          # An errored or missing row proves nothing; only "current" closes.
          if ! gh pr list --state open --json headRefName --jq '.[].headRefName' > /tmp/open-prs.txt; then
            warn "open-PR listing failed; skipping cleanup pass"
            exit 0
          fi
          while read -r br; do
            case "$br" in bump/*) ;; *) continue ;; esac
            name=${br#bump/}
            state=$(jq -r --arg n "$name" '
              [.[] | select(.name == $n)]
              | if length == 0 then "missing"
                elif .[0].error != null then "error"
                elif .[0].outdated then "outdated"
                else "current" end' /tmp/outdated.json)
            if [ "$state" = "current" ]; then
              if ! gh pr close "$br" --comment "No longer outdated; closing." --delete-branch; then
                warn "closing stale PR for $name failed"
              fi
            fi
          done < /tmp/open-prs.txt
