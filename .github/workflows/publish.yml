name: Publish

on:
  push:
    branches: [main]
    paths: ["pkgs/**"]
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated package names to force-build (empty = republish only)
        default: ""

permissions:
  contents: read
  packages: write

# Registry writes must serialize; cancelling a half-published run would leave
# v2-staging mid-flight.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.detect.outputs.source }}
      all: ${{ steps.detect.outputs.all }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/changed-packages
        with:
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          packages: ${{ inputs.packages }}

  # The three platform builds are chained, not a matrix: concurrent --push
  # legs of one package race on its archive index tag (read-modify-write;
  # last write wins and drops the other platform's entry).
  build-linux-amd64:
    needs: changes
    if: needs.changes.outputs.source != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.source) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
        run: nem catalog build "pkgs/$PKG/pkg.yaml" --push ghcr.io/vi-dev/nem-official-catalog

  build-linux-arm64:
    needs: [changes, build-linux-amd64]
    if: needs.changes.outputs.source != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.source) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
        run: nem catalog build "pkgs/$PKG/pkg.yaml" --push ghcr.io/vi-dev/nem-official-catalog

  build-darwin-arm64:
    needs: [changes, build-linux-arm64]
    if: needs.changes.outputs.source != '[]'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.source) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
        run: nem catalog build "pkgs/$PKG/pkg.yaml" --push ghcr.io/vi-dev/nem-official-catalog

  # Publishes the whole catalog to the staging tag only; :v2 is untouched.
  # !failure() (transitive over all ancestors) lets stage run when the build
  # chain was skipped for lack of source changes, but never after a failure.
  stage:
    needs: [changes, build-darwin-arm64]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          ghcr-token: ${{ github.token }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Verify archives complete
        shell: bash
        run: |
          # An index must never be staged while any oci-artifact package's latest
          # version is missing a platform archive: a later run would otherwise
          # promote packages an earlier failed run never finished building.
          base=ghcr.io/vi-dev/nem-official-catalog
          fail=0
          for f in pkgs/*/pkg.yaml; do
            yq -e '.artifact | has("oci")' "$f" >/dev/null 2>&1 || continue
            name=$(yq -r '.name' "$f")
            ver=$(yq -r '.versions[0].version // .versions[0]' "$f")
            plats=$(yq -r '(.platforms // ["darwin/arm64","darwin/amd64","linux/arm64","linux/amd64"]) | join(" ")' "$f")
            if ! idx=$(oras manifest fetch "$base/archives/$name:$ver" 2>/dev/null); then
              echo "MISSING: $name $ver has no archive index at all"
              fail=1
              continue
            fi
            read -ra plat_list <<< "$plats"
            for plat in "${plat_list[@]}"; do
              os=${plat%/*}
              arch=${plat#*/}
              if ! jq -e --arg os "$os" --arg arch "$arch" \
                '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch)' \
                >/dev/null <<<"$idx"; then
                echo "MISSING: $name $ver has no $plat archive"
                fail=1
              fi
            done
          done
          exit "$fail"
      - run: nem catalog publish ghcr.io/vi-dev/nem-official-catalog . --tag v2-staging

  # The full consumer path for every changed package, from the staging tag.
  smoke:
    needs: [changes, stage]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.any == 'true' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2-staging
          ghcr-token: ${{ github.token }}
      - name: Install changed packages
        shell: bash
        env:
          PKGS: ${{ join(fromJSON(needs.changes.outputs.all), ' ') }}
        run: |
          read -ra pkgs <<< "$PKGS"
          nem use -g "${pkgs[@]}"
          nem status -g

  # Digest-preserving retag; no re-publish, no second release tag. A skipped
  # smoke (no changed packages) must not block a bare republish.
  promote:
    needs: [stage, smoke]
    if: ${{ !cancelled() && needs.stage.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.smoke.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Promote v2-staging to v2
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras tag ghcr.io/vi-dev/nem-official-catalog:v2-staging v2
