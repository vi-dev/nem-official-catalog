name: Publish

on:
  push:
    branches: [main]
    paths: ["pkgs/**"]
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated package names to force-build (empty = republish only)
        default: ""

permissions:
  contents: read
  packages: write

# Registry writes must serialize; cancelling a half-published run would leave
# v2-staging mid-flight.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # What this run must do, derived from registry state rather than git
  # history: the concurrency group keeps one pending run and cancels older
  # ones, so a per-push diff can lose work — a re-derived plan cannot.
  # Builds come from archives the registry lacks; the smoke set comes
  # from manifests that differ from the live tag, plus every package a
  # dispatch names.
  plan:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      linux_amd64: ${{ steps.plan.outputs.linux_amd64 }}
      linux_arm64: ${{ steps.plan.outputs.linux_arm64 }}
      darwin_arm64: ${{ steps.plan.outputs.darwin_arm64 }}
      smoke: ${{ steps.plan.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          ghcr-token: ${{ github.token }}
      - id: plan
        name: Compute build and smoke plans
        shell: bash
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          if [ -n "$PACKAGES" ]; then
            # Force-build: named oci-artifact packages at their latest
            # declared version, whether or not archives already exist.
            read -ra pkgs <<< "$PACKAGES"
            entries=""
            for p in "${pkgs[@]}"; do
              f="pkgs/$p/pkg.yaml"
              [ -f "$f" ] || { echo "unknown package: $p" >&2; exit 1; }
              yq -e '.artifact | has("oci")' "$f" >/dev/null 2>&1 || continue
              entries+="$p $(yq -r '.versions[0].version // .versions[0]' "$f")"$'\n'
            done
            plan=$(printf '%s' "$entries" | jq -R -s -c \
              'split("\n") | map(select(length > 0) | split(" ") | {package: .[0], version: .[1]})')
            for plat in linux/amd64 linux/arm64 darwin/arm64; do
              key=$(printf '%s' "$plat" | tr '/' '_')
              echo "$key=$plan" >> "$GITHUB_OUTPUT"
            done
            {
              echo "### Force-build plan"
              echo '```json'
              jq . <<<"$plan"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            nem catalog missing ghcr.io/vi-dev/nem-official-catalog . --json > /tmp/missing.json
            for plat in linux/amd64 linux/arm64 darwin/arm64; do
              key=$(printf '%s' "$plat" | tr '/' '_')
              echo "$key=$(jq -c --arg p "$plat" '.[$p]' /tmp/missing.json)" >> "$GITHUB_OUTPUT"
            done
            {
              echo "### Missing archives"
              echo '```json'
              cat /tmp/missing.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          nem catalog diff ghcr.io/vi-dev/nem-official-catalog:v2 . --json > /tmp/diff.json
          smoke=$(jq -c '[.[] | select(.status == "new" or .status == "updated") | . as $r
            | (if ($r.versionsAdded | length) > 0 then $r.versionsAdded[] else $r.local end)
            | "\($r.name)@\(.)"]' /tmp/diff.json)
          if [ -n "$PACKAGES" ]; then
            # A dispatch always smokes every package it names, prebuilt ones
            # included: a rebuilt archive can change without its manifest
            # differing from live, which the diff-based set cannot see.
            forced=$(for p in "${pkgs[@]}"; do
              printf '%s@%s\n' "$p" "$(yq -r '.versions[0].version // .versions[0]' "pkgs/$p/pkg.yaml")"
            done | jq -R -s -c 'split("\n") | map(select(length > 0))')
            smoke=$(jq -c -n --argjson base "$smoke" --argjson forced "$forced" '$base + $forced | unique')
          fi
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          {
            echo "### Changed vs live catalog"
            echo '```json'
            jq '[.[] | select(.status != "unchanged")]' /tmp/diff.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The three platform builds are chained, not a matrix: concurrent --push
  # legs of one package race on its archive index tag (read-modify-write;
  # last write wins and drops the other platform's entry). !cancelled() keeps
  # a later leg running when an earlier one failed or was skipped — one
  # version's broken build must not block another platform's archives.
  build-linux-amd64:
    needs: plan
    if: ${{ needs.plan.outputs.linux_amd64 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_amd64) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
        run: nem catalog build "pkgs/$PKG/pkg.yaml" --version "$VER" --push ghcr.io/vi-dev/nem-official-catalog

  build-linux-arm64:
    needs: [plan, build-linux-amd64]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.linux_arm64 != '[]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_arm64) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
        run: nem catalog build "pkgs/$PKG/pkg.yaml" --version "$VER" --push ghcr.io/vi-dev/nem-official-catalog

  build-darwin-arm64:
    needs: [plan, build-linux-arm64]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.darwin_arm64 != '[]' }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.darwin_arm64) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
        run: nem catalog build "pkgs/$PKG/pkg.yaml" --version "$VER" --push ghcr.io/vi-dev/nem-official-catalog

  # Publishes the whole catalog to the staging tag only; :v2 is untouched.
  # !failure() (transitive over all ancestors) lets stage run when the build
  # chain was skipped for lack of work, but never after a failure.
  stage:
    needs: [plan, build-darwin-arm64]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          ghcr-token: ${{ github.token }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Verify archives complete
        shell: bash
        run: |
          # An index must never be staged while any oci-artifact package's latest
          # version is missing a platform archive: a later run would otherwise
          # promote packages an earlier failed run never finished building.
          base=ghcr.io/vi-dev/nem-official-catalog
          fail=0
          for f in pkgs/*/pkg.yaml; do
            yq -e '.artifact | has("oci")' "$f" >/dev/null 2>&1 || continue
            name=$(yq -r '.name' "$f")
            ver=$(yq -r '.versions[0].version // .versions[0]' "$f")
            plats=$(yq -r '(.platforms // ["darwin/arm64","darwin/amd64","linux/arm64","linux/amd64"]) | join(" ")' "$f")
            if ! idx=$(oras manifest fetch "$base/archives/$name:$ver" 2>/dev/null); then
              echo "MISSING: $name $ver has no archive index at all"
              fail=1
              continue
            fi
            read -ra plat_list <<< "$plats"
            for plat in "${plat_list[@]}"; do
              os=${plat%/*}
              arch=${plat#*/}
              if ! jq -e --arg os "$os" --arg arch "$arch" \
                '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch)' \
                >/dev/null <<<"$idx"; then
                echo "MISSING: $name $ver has no $plat archive"
                fail=1
              fi
            done
          done
          exit "$fail"
      - run: nem catalog publish ghcr.io/vi-dev/nem-official-catalog . --tag v2-staging

  # The full consumer path for every version this publish changes, installed
  # from the staging tag before anything is promoted.
  smoke:
    needs: [plan, stage]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.smoke != '[]' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2-staging
          ghcr-token: ${{ github.token }}
      - name: Install changed versions
        shell: bash
        env:
          ENTRIES: ${{ needs.plan.outputs.smoke }}
        run: |
          readarray -t entries < <(jq -r '.[]' <<< "$ENTRIES")
          for e in "${entries[@]}"; do
            nem use -g "$e"
          done
          nem status -g

  # Digest-preserving retag; no re-publish, no second release tag. A skipped
  # smoke (empty smoke set) must not block a bare republish.
  promote:
    needs: [stage, smoke]
    if: ${{ !cancelled() && needs.stage.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.smoke.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Promote v2-staging to v2
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras tag ghcr.io/vi-dev/nem-official-catalog:v2-staging v2
