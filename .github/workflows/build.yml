name: Build

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      package:
        description: One package@version pair to force-build (empty = only missing archives)
        default: ""
      force:
        description: With package, overwrite archives even when a rebuilt platform entry is unchanged
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Archive pushes must serialize with publish runs.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      linux_amd64: ${{ steps.plan.outputs.linux_amd64 }}
      linux_arm64: ${{ steps.plan.outputs.linux_arm64 }}
      darwin_arm64: ${{ steps.plan.outputs.darwin_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          ghcr-token: ${{ github.token }}
      - id: plan
        name: Compute build plan
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ -n "$PACKAGE" ]; then
            name=${PACKAGE%@*}
            ver=${PACKAGE##*@}
            plan=$(jq -c -n --arg p "$name" --arg v "$ver" '[{package: $p, version: $v}]')
            for plat in linux/amd64 linux/arm64 darwin/arm64; do
              key=$(printf '%s' "$plat" | tr '/' '_')
              echo "$key=$plan" >> "$GITHUB_OUTPUT"
            done
            {
              echo "### Force-build plan"
              echo '```json'
              jq . <<<"$plan"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            nem catalog missing ghcr.io/vi-dev/nem-official-catalog . --json > /tmp/plan.json
            {
              echo "### Missing archives"
              echo '```json'
              cat /tmp/plan.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            for plat in linux/amd64 linux/arm64 darwin/arm64; do
              key=$(printf '%s' "$plat" | tr '/' '_')
              echo "$key=$(jq -c --arg p "$plat" '.[$p]' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
            done
          fi

  # Build jibs are chained to avoid racing on the archive index.
  build-linux-amd64:
    needs: plan
    if: ${{ needs.plan.outputs.linux_amd64 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_amd64) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          nem catalog build "pkgs/$PKG/pkg.yaml" --version "$VER" --push ghcr.io/vi-dev/nem-official-catalog "${args[@]}"

  build-linux-arm64:
    needs: [plan, build-linux-amd64]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.linux_arm64 != '[]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_arm64) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          nem catalog build "pkgs/$PKG/pkg.yaml" --version "$VER" --push ghcr.io/vi-dev/nem-official-catalog "${args[@]}"

  build-darwin-arm64:
    needs: [plan, build-linux-arm64]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.darwin_arm64 != '[]' }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.darwin_arm64) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          nem catalog build "pkgs/$PKG/pkg.yaml" --version "$VER" --push ghcr.io/vi-dev/nem-official-catalog "${args[@]}"
