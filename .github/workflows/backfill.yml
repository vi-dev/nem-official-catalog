name: Backfill

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Shares the publish group: archive pushes must serialize with publish runs.
# GitHub keeps only one pending run per group, so a backfill queued behind a
# running publish is cancelled when another publish triggers — fine for a
# weekly sweep; re-dispatch manually if it must run now.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Which declared versions lack platform archives in the registry. Builds
  # are keyed off this plan, so a version that already has every archive
  # costs nothing beyond the index fetch.
  plan:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      linux_amd64: ${{ steps.plan.outputs.linux_amd64 }}
      linux_arm64: ${{ steps.plan.outputs.linux_arm64 }}
      darwin_arm64: ${{ steps.plan.outputs.darwin_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          ghcr-token: ${{ github.token }}
      - id: plan
        name: Compute missing archives
        shell: bash
        run: |
          nem catalog missing ghcr.io/vi-dev/nem-official-catalog . --json > /tmp/plan.json
          {
            echo "### Missing archives"
            echo '```json'
            cat /tmp/plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for plat in linux/amd64 linux/arm64 darwin/arm64; do
            key=$(printf '%s' "$plat" | tr '/' '_')
            echo "$key=$(jq -c --arg p "$plat" '.[$p]' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
          done

  # The three platform builds are chained, not a matrix: concurrent --push
  # legs of one package race on its archive index tag (read-modify-write;
  # last write wins and drops the other platform's entry). !cancelled() keeps
  # a later leg running when an earlier one failed or was skipped — one
  # version's broken build must not block another platform's backfill.
  build-linux-amd64:
    needs: plan
    if: ${{ needs.plan.outputs.linux_amd64 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_amd64) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
        run: nem catalog build "pkgs/$PKG/pkg.yaml" --version "$VER" --push ghcr.io/vi-dev/nem-official-catalog

  build-linux-arm64:
    needs: [plan, build-linux-amd64]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.linux_arm64 != '[]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_arm64) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
        run: nem catalog build "pkgs/$PKG/pkg.yaml" --version "$VER" --push ghcr.io/vi-dev/nem-official-catalog

  build-darwin-arm64:
    needs: [plan, build-linux-arm64]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.darwin_arm64 != '[]' }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.darwin_arm64) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nem
        with:
          catalog: ghcr.io/vi-dev/nem-official-catalog:v2
          ghcr-token: ${{ github.token }}
      - name: Build and push archive
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
        run: nem catalog build "pkgs/$PKG/pkg.yaml" --version "$VER" --push ghcr.io/vi-dev/nem-official-catalog
