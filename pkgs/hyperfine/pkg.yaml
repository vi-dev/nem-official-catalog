schema: 2
name: hyperfine
description: Command-line benchmarking tool
homepage: https://github.com/sharkdp/hyperfine
license: MIT

versionDiscovery:
  github:
    repo: sharkdp/hyperfine
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sharkdp/hyperfine/releases/download/v{{.Version}}/hyperfine-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "hyperfine", dst: "bin/hyperfine", mode: 0o755}

bins: ["bin"]

versions:
  - version: 1.20.0
    sha256:
      darwin/arm64: "8ee7067016620447c9d2d6234ec9a4680f958b7ad983549b56334668f63075b5"
