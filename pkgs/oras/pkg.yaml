schema: 2
name: oras
description: OCI registry client for managing artifacts
homepage: https://oras.land
license: Apache-2.0

versionDiscovery:
  github:
    repo: oras-project/oras
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/oras-project/oras/releases/download/v{{.Version}}/oras_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "oras", dst: "bin/oras", mode: 0o755}

bins: ["bin"]

