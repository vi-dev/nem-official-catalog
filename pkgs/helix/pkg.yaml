schema: 2
name: helix
description: Post-modern modal text editor
homepage: https://helix-editor.com
license: MPL-2.0

versionDiscovery:
  github:
    repo: helix-editor/helix
    filter: '^\d+\.\d+(\.\d+)?$'

artifact:
  url: "https://github.com/helix-editor/helix/releases/download/{{.Version}}/helix-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace .OS \"darwin\" \"macos\"}}.tar.xz"

install:
  - extract: {strip: 1}

# hx looks for its runtime/ next to the executable, so the binary stays at the
# package root beside runtime/ instead of moving into bin/.
bins: ["."]

