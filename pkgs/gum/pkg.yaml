schema: 2
name: gum
description: Glamorous shell script building blocks
homepage: https://github.com/charmbracelet/gum
license: MIT

versionDiscovery:
  github:
    repo: charmbracelet/gum
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/charmbracelet/gum/releases/download/v{{.Version}}/gum_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "gum", dst: "bin/gum", mode: 0o755}

bins: ["bin"]

