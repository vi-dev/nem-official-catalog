schema: 2
name: gum
description: Glamorous shell script building blocks
homepage: https://github.com/charmbracelet/gum
license: MIT

versionDiscovery:
  github:
    repo: charmbracelet/gum
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/charmbracelet/gum/releases/download/v{{.Version}}/gum_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "gum", dst: "bin/gum", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.17.0
    sha256:
      darwin/arm64: "e2a4b8596efa05821d8c58d0c1afbcd7ad1699ba69c689cc3ff23a4a99c8b237"
      darwin/amd64: "cd66576aeebe6cd19c771863c7e8d696e0e1d5387d1e7075666baa67c2052e53"
      linux/arm64: "b0b9ed95cbf7c8b7073f17b9591811f5c001e33c7cfd066ca83ce8a07c576f9c"
      linux/amd64: "69ee169bd6387331928864e94d47ed01ef649fbfe875baed1bbf27b5377a6fdb"
