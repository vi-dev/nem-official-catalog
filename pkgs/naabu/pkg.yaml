schema: 2
name: naabu
description: Port scanner for attack surface discovery
homepage: https://github.com/projectdiscovery/naabu
license: MIT

versionDiscovery:
  github:
    repo: projectdiscovery/naabu
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/projectdiscovery/naabu/releases/download/v{{.Version}}/naabu_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "naabu", dst: "bin/naabu", mode: 0o755}

bins: ["bin"]

versions:
