schema: 2
name: kubectl-oomd
description: Show recently OOMKilled pods and containers
homepage: https://github.com/jdockerty/kubectl-oomd
license: Apache-2.0

versionDiscovery:
  github:
    repo: jdockerty/kubectl-oomd
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/jdockerty/kubectl-oomd/releases/download/v{{.Version}}/oomd_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "oomd", dst: "bin/kubectl-oomd", mode: 0o755}

bins: ["bin"]

versions:
