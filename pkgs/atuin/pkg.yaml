schema: 2
name: atuin
description: Shell history with sync and search
homepage: https://atuin.sh
license: MIT

versionDiscovery:
  github:
    repo: atuinsh/atuin
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/atuinsh/atuin/releases/download/v{{.Version}}/atuin-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "atuin", dst: "bin/atuin", mode: 0o755}

bins: ["bin"]

versions:
