schema: 2
name: arduino-cli
description: Command line interface for Arduino boards and sketches
homepage: https://arduino.github.io/arduino-cli/
license: GPL-3.0

versionDiscovery:
  github:
    repo: arduino/arduino-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/arduino/arduino-cli/releases/download/v{{.Version}}/arduino-cli_{{.Version}}_{{replace (replace .OS \"darwin\" \"macOS\") \"linux\" \"Linux\"}}_{{replace (replace .Arch \"amd64\" \"64bit\") \"arm64\" \"ARM64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "arduino-cli", dst: "bin/arduino-cli", mode: 0o755}

bins: ["bin"]

versions:
