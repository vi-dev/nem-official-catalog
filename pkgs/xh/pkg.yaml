schema: 2
name: xh
description: Friendly and fast HTTP client
homepage: https://github.com/ducaale/xh
license: MIT

versionDiscovery:
  github:
    repo: ducaale/xh
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ducaale/xh/releases/download/v{{.Version}}/xh-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "xh", dst: "bin/xh", mode: 0o755}

bins: ["bin"]

