schema: 2

name: openssl
description: Cryptography and TLS toolkit — libcrypto/libssl plus the openssl CLI
homepage: https://www.openssl.org
license: Apache-2.0

platforms: [darwin/arm64, linux/arm64, linux/amd64]

bins: [bin]
# Link dependents must pin compat to the libcrypto/libssl major ("3" or
# "4"): the dylib/soname tracks the major, and majors are not ABI-compatible.
libs: [lib]

versionDiscovery:
  github:
    repo: openssl/openssl
    filter: '^openssl-\d+\.\d+\.\d+$'
    prefix: "openssl-"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 4.0.1
    sourceSha256: "2db3f3a0d6ea4b59e1f094ace2c8cd536dffb87cdc39084c5afa1e6f7f37dd09"
