schema: 2
name: lua-language-server
description: Language server for Lua
homepage: https://luals.github.io
license: MIT

versionDiscovery:
  github:
    repo: LuaLS/lua-language-server
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/LuaLS/lua-language-server/releases/download/{{.Version}}/lua-language-server-{{.Version}}-{{.OS}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

# The launcher resolves main.lua and meta/ relative to itself, so the whole
# extracted tree has to stay in place.
install:
  - extract: {strip: 0}

bins: ["bin"]

versions:
