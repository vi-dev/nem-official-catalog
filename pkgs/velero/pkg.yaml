schema: 2
name: velero
description: Backup and restore Kubernetes cluster resources and volumes
homepage: https://velero.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: vmware-tanzu/velero
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/vmware-tanzu/velero/releases/download/v{{.Version}}/velero-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "velero", dst: "bin/velero", mode: 0o755}

bins: ["bin"]

