schema: 2
name: steampipe
description: Query cloud APIs with SQL
homepage: https://steampipe.io
license: AGPL-3.0-only

versionDiscovery:
  github:
    repo: turbot/steampipe
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/turbot/steampipe/releases/download/v{{.Version}}/steampipe_{{.OS}}_{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 0}
  - copy: {src: "steampipe", dst: "bin/steampipe", mode: 0o755}

bins: ["bin"]

