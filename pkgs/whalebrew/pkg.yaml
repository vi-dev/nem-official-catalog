schema: 2
name: whalebrew
description: Install Docker images as command-line tools
homepage: https://github.com/whalebrew/whalebrew
license: Apache-2.0

versionDiscovery:
  github:
    repo: whalebrew/whalebrew
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/whalebrew/whalebrew/releases/download/{{.Version}}/whalebrew-{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}-{{replace .Arch \"amd64\" \"x86_64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/whalebrew", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.5.0
