schema: 2
name: minijinja-cli
description: Command line renderer for Jinja2 templates
homepage: https://github.com/mitsuhiko/minijinja
license: Apache-2.0

versionDiscovery:
  github:
    repo: mitsuhiko/minijinja
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/mitsuhiko/minijinja/releases/download/{{.Version}}/minijinja-cli-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "minijinja-cli", dst: "bin/minijinja-cli", mode: 0o755}

bins: ["bin"]

versions:
