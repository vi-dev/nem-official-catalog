schema: 2
name: grpcui
description: Web UI for interacting with gRPC servers
homepage: https://github.com/fullstorydev/grpcui
license: MIT

versionDiscovery:
  github:
    repo: fullstorydev/grpcui
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/fullstorydev/grpcui/releases/download/v{{.Version}}/grpcui_{{.Version}}_{{replace .OS \"darwin\" \"osx\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "grpcui", dst: "bin/grpcui", mode: 0o755}

bins: ["bin"]

