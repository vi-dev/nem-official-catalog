schema: 2
name: kwokctl
description: Simulate Kubernetes clusters with KWOK
homepage: https://kwok.sigs.k8s.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubernetes-sigs/kwok
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubernetes-sigs/kwok/releases/download/v{{.Version}}/kwokctl-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kwokctl", mode: 0o755}

bins: ["bin"]

