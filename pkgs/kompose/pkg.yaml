schema: 2
name: kompose
description: Convert docker-compose files to Kubernetes manifests
homepage: https://kompose.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubernetes/kompose
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubernetes/kompose/releases/download/v{{.Version}}/kompose-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kompose", mode: 0o755}

bins: ["bin"]

versions:
