schema: 2
name: zellij
description: Terminal workspace and multiplexer
homepage: https://zellij.dev
license: MIT

versionDiscovery:
  github:
    repo: zellij-org/zellij
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/zellij-org/zellij/releases/download/v{{.Version}}/zellij-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "zellij", dst: "bin/zellij", mode: 0o755}

bins: ["bin"]

