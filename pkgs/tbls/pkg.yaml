schema: 2
name: tbls
description: CI-friendly tool for documenting a database schema
homepage: https://github.com/k1LoW/tbls
license: MIT

versionDiscovery:
  github:
    repo: k1LoW/tbls
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/k1LoW/tbls/releases/download/v{{.Version}}/tbls_v{{.Version}}_{{.OS}}_{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 0}
  - copy: {src: "tbls", dst: "bin/tbls", mode: 0o755}

bins: ["bin"]

versions:
