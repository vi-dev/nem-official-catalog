schema: 2
name: typst
description: Markup-based typesetting system
homepage: https://typst.app
license: Apache-2.0

versionDiscovery:
  github:
    repo: typst/typst
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/typst/typst/releases/download/v{{.Version}}/typst-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "typst", dst: "bin/typst", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.15.1
    sha256:
