schema: 2
name: gost
description: Tunnel and proxy server speaking many protocols
homepage: https://gost.run
license: MIT

versionDiscovery:
  github:
    repo: go-gost/gost
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/go-gost/gost/releases/download/v{{.Version}}/gost_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gost", dst: "bin/gost", mode: 0o755}

bins: ["bin"]

