schema: 2
name: k3sup
description: Bootstrap k3s clusters over SSH
homepage: https://github.com/alexellis/k3sup
license: MIT

versionDiscovery:
  github:
    repo: alexellis/k3sup
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/alexellis/k3sup/releases/download/{{.Version}}/k3sup{{if eq .OS \"darwin\"}}-darwin{{end}}{{if eq .Arch \"arm64\"}}-arm64{{end}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/k3sup", mode: 0o755}

bins: ["bin"]

