schema: 2
name: mongosh
description: MongoDB Shell
homepage: https://www.mongodb.com/docs/mongodb-shell/
license: Apache-2.0

versionDiscovery:
  github:
    repo: mongodb-js/mongosh
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/mongodb-js/mongosh/releases/download/v{{.Version}}/mongosh-{{.Version}}-{{.OS}}-{{replace .Arch \"amd64\" \"x64\"}}.{{if eq .OS \"darwin\"}}zip{{else}}tgz{{end}}"

install:
  - extract: {strip: 1}

bins: ["bin"]

