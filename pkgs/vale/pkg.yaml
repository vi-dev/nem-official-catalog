schema: 2
name: vale
description: Syntax-aware prose linter
homepage: https://vale.sh
license: MIT

versionDiscovery:
  github:
    repo: errata-ai/vale
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/errata-ai/vale/releases/download/v{{.Version}}/vale_{{.Version}}_{{replace (replace .OS \"darwin\" \"macOS\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"64-bit\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "vale", dst: "bin/vale", mode: 0o755}

bins: ["bin"]

