schema: 2
name: k3d
description: Run k3s Kubernetes clusters in Docker
homepage: https://k3d.io
license: MIT

versionDiscovery:
  github:
    repo: k3d-io/k3d
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/k3d-io/k3d/releases/download/v{{.Version}}/k3d-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/k3d", mode: 0o755}

bins: ["bin"]

