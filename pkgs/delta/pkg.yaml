schema: 2
name: delta
description: Syntax-highlighting pager for git, diff, and grep output
homepage: https://github.com/dandavison/delta
license: MIT

platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: dandavison/delta
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/dandavison/delta/releases/download/{{.Version}}/delta-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "delta", dst: "bin/delta", mode: 0o755}

bins: ["bin"]

