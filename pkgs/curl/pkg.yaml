schema: 2

name: curl
description: Command-line tool and library for transferring data with URLs
homepage: https://curl.se
license: curl

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# compat pins the libcrypto/libssl major; openssl majors are not ABI-compatible.
# libunistring is transitive via libidn2/libpsl; listed so the loader path is
# complete.
deps:
  - name: openssl
    kind: link
    compat: "4"
  - name: zlib
    kind: link
    compat: "1"
  - name: libnghttp2
    kind: link
    compat: "1"
  - name: brotli
    kind: link
    compat: "1"
  - name: zstd
    kind: link
    compat: "1"
  - name: libpsl
    kind: link
    compat: "0"
  - name: libidn2
    kind: link
    compat: "2"
  - name: libunistring
    kind: link
    compat: "1"
  - name: libssh2
    kind: link
    compat: "1"
  - name: libnghttp3
    kind: link
    compat: "1"
  - name: libngtcp2
    kind: link
    compat: "1"

bins: [bin]
libs: [lib]

versionDiscovery:
  http:
    url: https://curl.se/download/
    filter: 'curl-(\d+\.\d+\.\d+)\.tar\.gz'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 8.21.0
    sourceSha256: "d9b327997999045a24cda50f3983e69e51c516bd8be6ef9842fc7f99135e33bb"

build:
  deps:
    - pkgconf
    - name: openssl
      kind: link
      compat: "4"
    - name: zlib
      kind: link
      compat: "1"
    - name: libnghttp2
      kind: link
      compat: "1"
    - name: brotli
      kind: link
      compat: "1"
    - name: zstd
      kind: link
      compat: "1"
    - name: libpsl
      kind: link
      compat: "0"
    - name: libidn2
      kind: link
      compat: "2"
    - name: libunistring
      kind: link
      compat: "1"
    - name: libssh2
      kind: link
      compat: "1"
    - name: libnghttp3
      kind: link
      compat: "1"
    - name: libngtcp2
      kind: link
      compat: "1"
  source:
    url: 'https://curl.se/download/curl-{{.Version}}.tar.gz'
  output: out
  steps:
    # Differing --build/--host skip configure's runtime-libs probe, which
    # cannot run against staged deps; darwin must keep the "apple" vendor.
    - run: |
        set -e
        build_triple="$(./config.guess)"
        case "$NEM_OS" in
          darwin) host_triple=$(printf %s "$build_triple" | sed 's/darwin[0-9.]*$/darwin/'); sectrust=--with-apple-sectrust ;;
          *)      host_triple=$(printf %s "$build_triple" | sed 's/^\([^-]*\)-[^-]*-/\1-nem-/'); sectrust= ;;
        esac
        ./configure --build="$build_triple" --host="$host_triple" --prefix=/ --libdir=/lib --disable-static --disable-dependency-tracking \
          --with-openssl --with-ca-fallback --with-zlib \
          --with-nghttp2 --with-brotli --with-zstd --with-libidn2 --with-libpsl \
          --with-libssh2 --with-nghttp3 --with-ngtcp2 \
          --disable-ldap --disable-ldaps $sectrust
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
        rm -f "$NEM_OUTPUT/lib/"*.la
