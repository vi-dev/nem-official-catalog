schema: 2
name: esbuild
description: Extremely fast bundler and minifier for JavaScript and CSS
homepage: https://esbuild.github.io
license: MIT

versionDiscovery:
  github:
    repo: evanw/esbuild
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

# Upstream ships native binaries only through per-platform npm packages;
# each tarball holds the executable at package/bin/esbuild.
artifact:
  url: "https://registry.npmjs.org/@esbuild/{{.OS}}-{{replace .Arch \"amd64\" \"x64\"}}/-/{{.OS}}-{{replace .Arch \"amd64\" \"x64\"}}-{{.Version}}.tgz"

install:
  - extract: {strip: 1}

bins: ["bin"]

