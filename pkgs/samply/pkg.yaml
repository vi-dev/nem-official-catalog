schema: 2
name: samply
description: Command-line sampling profiler
homepage: https://github.com/mstange/samply
license: Apache-2.0

versionDiscovery:
  github:
    repo: mstange/samply
    filter: '^samply-v\d+\.\d+\.\d+$'
    prefix: "samply-v"

artifact:
  url: "https://github.com/mstange/samply/releases/download/samply-v{{.Version}}/samply-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "samply", dst: "bin/samply", mode: 0o755}

bins: ["bin"]

versions:
