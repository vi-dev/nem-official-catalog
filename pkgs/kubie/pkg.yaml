schema: 2
name: kubie
description: Context and namespace switcher for kubectl using subshells
homepage: https://github.com/kubie-org/kubie
license: Zlib

versionDiscovery:
  github:
    repo: kubie-org/kubie
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubie-org/kubie/releases/download/v{{.Version}}/kubie-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kubie", mode: 0o755}

bins: ["bin"]

