schema: 2
name: linkerd
description: Linkerd service mesh CLI (edge release channel)
homepage: https://linkerd.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: linkerd/linkerd2
    filter: '^edge-\d+\.\d+\.\d+$'
    prefix: "edge-"

# Open-source linkerd releases only on the edge channel; the darwin/amd64
# asset carries no arch suffix.
artifact:
  url: "https://github.com/linkerd/linkerd2/releases/download/edge-{{.Version}}/linkerd2-cli-edge-{{.Version}}-{{if and (eq .OS \"darwin\") (eq .Arch \"amd64\")}}darwin{{else}}{{.OS}}-{{.Arch}}{{end}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/linkerd", mode: 0o755}

bins: ["bin"]

