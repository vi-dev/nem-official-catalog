schema: 2
name: mockery
description: Mock code generator for Go interfaces
homepage: https://vektra.github.io/mockery/
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: vektra/mockery
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/vektra/mockery/releases/download/v{{.Version}}/mockery_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "mockery", dst: "bin/mockery", mode: 0o755}

bins: ["bin"]

