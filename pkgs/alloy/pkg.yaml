schema: 2
name: alloy
description: OpenTelemetry Collector distribution with programmable pipelines
homepage: https://grafana.com/oss/alloy
license: Apache-2.0

versionDiscovery:
  github:
    repo: grafana/alloy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/grafana/alloy/releases/download/v{{.Version}}/alloy-{{.OS}}-{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "alloy-{{.OS}}-{{.Arch}}", dst: "bin/alloy", mode: 0o755}

bins: ["bin"]

