schema: 2
name: kiota
description: OpenAPI-based HTTP client code generator
homepage: https://github.com/microsoft/kiota
license: MIT

versionDiscovery:
  github:
    repo: microsoft/kiota
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/microsoft/kiota/releases/download/v{{.Version}}/{{replace .OS \"darwin\" \"osx\"}}-{{replace .Arch \"amd64\" \"x64\"}}.zip"

# kiota reads appsettings.json from its own directory, so the archive is kept
# intact rather than copying the binary into bin/.
install:
  - extract: {strip: 0}

bins: ["."]

versions:
