schema: 2
name: dyff
description: Diff tool for YAML files, and sometimes JSON
homepage: https://github.com/homeport/dyff
license: MIT

versionDiscovery:
  github:
    repo: homeport/dyff
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/homeport/dyff/releases/download/v{{.Version}}/dyff_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "dyff", dst: "bin/dyff", mode: 0o755}

bins: ["bin"]

