schema: 2
name: mago
description: PHP toolchain with formatter, linter, and static analyzer
homepage: https://mago.carthage.software
license: Apache-2.0

versionDiscovery:
  github:
    repo: carthage-software/mago
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/carthage-software/mago/releases/download/{{.Version}}/mago-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "mago", dst: "bin/mago", mode: 0o755}

bins: ["bin"]

