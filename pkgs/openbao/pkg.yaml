schema: 2
name: openbao
description: Secrets and identity management server, a fork of Vault
homepage: https://openbao.org
license: MPL-2.0

versionDiscovery:
  github:
    repo: openbao/openbao
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/openbao/openbao/releases/download/v{{.Version}}/openbao_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "bao", dst: "bin/bao", mode: 0o755}

bins: ["bin"]

