schema: 2
name: dprint
description: Pluggable code formatting platform
homepage: https://dprint.dev
license: MIT

versionDiscovery:
  github:
    repo: dprint/dprint
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/dprint/dprint/releases/download/{{.Version}}/dprint-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "dprint", dst: "bin/dprint", mode: 0o755}

bins: ["bin"]

