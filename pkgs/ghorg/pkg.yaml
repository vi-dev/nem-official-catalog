schema: 2
name: ghorg
description: Clone every repository of a GitHub, GitLab, or Bitbucket org
homepage: https://github.com/gabrie30/ghorg
license: Apache-2.0

versionDiscovery:
  github:
    repo: gabrie30/ghorg
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/gabrie30/ghorg/releases/download/v{{.Version}}/ghorg_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "ghorg", dst: "bin/ghorg", mode: 0o755}

bins: ["bin"]

