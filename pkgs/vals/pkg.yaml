schema: 2
name: vals
description: Resolve secret references in configuration values
homepage: https://github.com/helmfile/vals
license: Apache-2.0

versionDiscovery:
  github:
    repo: helmfile/vals
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/helmfile/vals/releases/download/v{{.Version}}/vals_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "vals", dst: "bin/vals", mode: 0o755}

bins: ["bin"]

