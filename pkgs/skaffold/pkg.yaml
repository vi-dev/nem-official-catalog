schema: 2
name: skaffold
description: Continuous development workflow for Kubernetes applications
homepage: https://skaffold.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: GoogleContainerTools/skaffold
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/GoogleContainerTools/skaffold/releases/download/v{{.Version}}/skaffold-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/skaffold", mode: 0o755}

bins: ["bin"]

