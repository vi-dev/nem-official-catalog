schema: 2
name: freeze
description: Generate images of code and terminal output
homepage: https://github.com/charmbracelet/freeze
license: MIT

versionDiscovery:
  github:
    repo: charmbracelet/freeze
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/charmbracelet/freeze/releases/download/v{{.Version}}/freeze_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "freeze", dst: "bin/freeze", mode: 0o755}

bins: ["bin"]

versions:
