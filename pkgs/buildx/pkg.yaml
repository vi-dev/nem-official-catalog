schema: 2
name: buildx
description: Docker CLI plugin for extended build capabilities
homepage: https://github.com/docker/buildx
license: Apache-2.0

versionDiscovery:
  github:
    repo: docker/buildx
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/docker/buildx/releases/download/v{{.Version}}/buildx-v{{.Version}}.{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/docker-buildx", mode: 0o755}

bins: ["bin"]

