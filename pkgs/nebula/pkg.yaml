schema: 2
name: nebula
description: Overlay networking tool built on the Noise protocol
homepage: https://github.com/slackhq/nebula
license: MIT

versionDiscovery:
  github:
    repo: slackhq/nebula
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/slackhq/nebula/releases/download/v{{.Version}}/nebula-{{if eq .OS \"darwin\"}}darwin.zip{{else}}linux-{{.Arch}}.tar.gz{{end}}"

install:
  - extract: {strip: 0}
  - copy: {src: "nebula", dst: "bin/nebula", mode: 0o755}
  - copy: {src: "nebula-cert", dst: "bin/nebula-cert", mode: 0o755}

bins: ["bin"]

