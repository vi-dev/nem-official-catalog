schema: 2
name: saml2aws
description: Get AWS credentials via SAML identity providers
homepage: https://github.com/Versent/saml2aws
license: MIT

versionDiscovery:
  github:
    repo: Versent/saml2aws
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Versent/saml2aws/releases/download/v{{.Version}}/saml2aws_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "saml2aws", dst: "bin/saml2aws", mode: 0o755}

bins: ["bin"]

