schema: 2
name: git-branchless
description: Git workflow tools for stacked commits and history rewriting
homepage: https://github.com/arxanas/git-branchless
license: MIT OR Apache-2.0

platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: arxanas/git-branchless
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/arxanas/git-branchless/releases/download/v{{.Version}}/git-branchless-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  # Tar entries are prefixed "./", so the root level costs one strip component.
  - extract: {strip: 1}
  - copy: {src: "git-branchless", dst: "bin/git-branchless", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.11.1
    sha256:
      darwin/arm64: "1150c869de3e68d670eea82d1622b8d3add1bc086750e89a9343adc44944f1f1"
      linux/arm64: "acb104bb91b69acd10ea0c8f9c1281ecce07c1346bee762317147d0fdf8e7463"
      linux/amd64: "18e924fba1862ae234651b2b2de40ccf6ee2dd9b068279705a0d242f5d413e00"
