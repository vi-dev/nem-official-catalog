schema: 2
name: mvnd
description: Maven daemon that keeps a JVM warm between builds
homepage: https://github.com/apache/maven-mvnd
license: Apache-2.0

deps:
  - jdk25

versionDiscovery:
  github:
    repo: apache/maven-mvnd
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/apache/maven-mvnd/releases/download/{{.Version}}/maven-mvnd-{{.Version}}-{{.OS}}-{{replace .Arch \"arm64\" \"aarch64\"}}.tar.gz"

# The launcher resolves the bundled mvn/ and lib/ trees relative to itself, so
# the whole distribution is kept in place.
install:
  - extract: {strip: 1}

bins: ["bin"]

versions:
  - version: 1.0.6
    sha256:
      darwin/arm64: "371f008b91ff6ec54e960935974f3868ee7f18195a0ec874940d58353d8b2796"
      darwin/amd64: "8202c79bad529d519461b61d8db3f17de5731d3b47b45d294d4df84b346555ed"
      linux/arm64: "e1d8071e172740ecd6a9c380938de69aafc7622218818c56e4d526cc761723c0"
      linux/amd64: "88fd474fd3f21b33ec1e6a75950f6abbe493d63a5e2b429475f5230b3ee6cb24"
