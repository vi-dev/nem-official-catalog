schema: 2
name: lefthook
description: Git hooks manager for polyglot projects
homepage: https://lefthook.dev
license: MIT

versionDiscovery:
  github:
    repo: evilmartians/lefthook
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

# Upstream also ships a .gz of each binary; the uncompressed asset is used
# because a bare gzip stream is not an archive nem can extract.
artifact:
  url: "https://github.com/evilmartians/lefthook/releases/download/v{{.Version}}/lefthook_{{.Version}}_{{replace (replace .OS \"darwin\" \"MacOS\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/lefthook", mode: 0o755}

bins: ["bin"]

