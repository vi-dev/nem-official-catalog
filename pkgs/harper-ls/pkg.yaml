schema: 2
name: harper-ls
description: Language server for the Harper grammar checker
homepage: https://writewithharper.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: Automattic/harper
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Automattic/harper/releases/download/v{{.Version}}/harper-ls-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "harper-ls", dst: "bin/harper-ls", mode: 0o755}

bins: ["bin"]

