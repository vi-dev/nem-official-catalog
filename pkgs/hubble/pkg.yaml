schema: 2
name: hubble
description: CLI for Cilium Hubble network observability
homepage: https://github.com/cilium/hubble
license: Apache-2.0

versionDiscovery:
  github:
    repo: cilium/hubble
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cilium/hubble/releases/download/v{{.Version}}/hubble-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "hubble", dst: "bin/hubble", mode: 0o755}

bins: ["bin"]

