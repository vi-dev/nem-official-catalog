schema: 2
name: yamlfmt
description: Formatter for YAML files
homepage: https://github.com/google/yamlfmt
license: Apache-2.0

versionDiscovery:
  github:
    repo: google/yamlfmt
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/google/yamlfmt/releases/download/v{{.Version}}/yamlfmt_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "yamlfmt", dst: "bin/yamlfmt", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.21.0
    sha256:
      darwin/arm64: "4b417ecb94339d57e4c122ecc948c1a00fe328b5853266de9806e652a92858fa"
      darwin/amd64: "060e943bcb8583c456810eb1ff4721b4f46c4a0c1a4432449d5dc3bbfe29a22b"
      linux/arm64: "5b2689c963b177271330c5ce8ca7396751107e5a826be46f03d2cb9b6f0c7784"
      linux/amd64: "1f300d9257b232bb3b541d7fb1b0e6b3c121bcbab381c86cd38cb8722be8a566"
