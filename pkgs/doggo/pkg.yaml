schema: 2
name: doggo
description: Command-line DNS client
homepage: https://doggo.mrkaran.dev
license: GPL-3.0

versionDiscovery:
  github:
    repo: mr-karan/doggo
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/mr-karan/doggo/releases/download/v{{.Version}}/doggo-{{.OS}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "doggo", dst: "bin/doggo", mode: 0o755}

bins: ["bin"]

