schema: 2
name: grex
description: Generate regular expressions from user-provided test cases
homepage: https://github.com/pemistahl/grex
license: Apache-2.0

versionDiscovery:
  github:
    repo: pemistahl/grex
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pemistahl/grex/releases/download/v{{.Version}}/grex-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "grex", dst: "bin/grex", mode: 0o755}

bins: ["bin"]

versions:
  - version: 1.4.6
    sha256:
      darwin/arm64: "5a249c9c7866835f8b0be95475fc49189da412c09f95266ffa8401b85c094078"
