schema: 2

name: libgpg-error
description: Error codes and runtime support shared by the GnuPG components
homepage: https://www.gnupg.org/software/libgpg-error/
license: LGPL-2.1-or-later

platforms: [darwin/arm64, linux/arm64, linux/amd64]

libs: [lib]

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: v1.51
    sourceSha256: "be0f1b2db6b93eed55369cdf79f19f72750c8c7c39fc20b577e724545427e6b2"

build:
  source:
    url: 'https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-{{trimPrefix .Version "v"}}.tar.bz2'
  output: out
  steps:
    - run: ./configure --prefix=/ --libdir=/lib --disable-dependency-tracking --enable-shared --disable-static --disable-doc --disable-nls --disable-tests && make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)" && make install DESTDIR="$NEM_OUTPUT"
    # macOS: rewrite the absolute dylib id to @rpath. Drop the libtool archive —
    # its baked libdir misleads a dependent's libtool once installed elsewhere.
    - run: |
        case "$NEM_OS" in
        darwin)
          cd "$NEM_OUTPUT"
          install_name_tool -id @rpath/libgpg-error.0.dylib lib/libgpg-error.0.dylib
          codesign -f -s - lib/libgpg-error.0.dylib
          ;;
        esac
        rm -f "$NEM_OUTPUT/lib"/*.la
