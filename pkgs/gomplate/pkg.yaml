schema: 2
name: gomplate
description: Command line template renderer with local and remote datasources
homepage: https://gomplate.ca
license: MIT

versionDiscovery:
  github:
    repo: hairyhenderson/gomplate
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/hairyhenderson/gomplate/releases/download/v{{.Version}}/gomplate_{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/gomplate", mode: 0o755}

bins: ["bin"]

