schema: 2
name: wasmer
description: WebAssembly runtime supporting WASI and Emscripten
homepage: https://wasmer.io
license: MIT

platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: wasmerio/wasmer
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/wasmerio/wasmer/releases/download/v{{.Version}}/wasmer-{{.OS}}-{{if eq .OS \"linux\"}}{{replace .Arch \"arm64\" \"aarch64\"}}{{else}}{{.Arch}}{{end}}.tar.gz"

install:
  - extract: {strip: 0}

bins: ["bin"]

