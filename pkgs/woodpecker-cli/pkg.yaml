schema: 2
name: woodpecker-cli
description: Command-line client for the Woodpecker CI engine
homepage: https://woodpecker-ci.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: woodpecker-ci/woodpecker
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/woodpecker-ci/woodpecker/releases/download/v{{.Version}}/woodpecker-cli_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "woodpecker-cli", dst: "bin/woodpecker-cli", mode: 0o755}

bins: ["bin"]

