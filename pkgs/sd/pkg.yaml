schema: 2
name: sd
description: Intuitive find-and-replace, a sed alternative
homepage: https://github.com/chmln/sd
license: MIT

versionDiscovery:
  github:
    repo: chmln/sd
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/chmln/sd/releases/download/v{{.Version}}/sd-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "sd", dst: "bin/sd", mode: 0o755}

bins: ["bin"]

versions:
  - version: 1.1.0
    sha256:
      darwin/arm64: "4bd3c09226376ca0a1d69589c91e86276fae36c5fbaaee669afce583f6682030"
      darwin/amd64: "1fca1e9c91813a8aac6821063c923107ba0f66a83309e095edcd3b202f67f97e"
      linux/arm64: "ec8c93c0533ff21f4851d11566808d4082544baf063d9b96ea77c27e98b7cd99"
      linux/amd64: "02f00f4777d43e8e95b7b8d49e1a0d6e502fed4b8e79c1c8b8063857a30caa2e"
