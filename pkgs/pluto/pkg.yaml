schema: 2
name: pluto
description: Detect deprecated Kubernetes API versions
homepage: https://github.com/FairwindsOps/pluto
license: Apache-2.0

versionDiscovery:
  github:
    repo: FairwindsOps/pluto
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/FairwindsOps/pluto/releases/download/v{{.Version}}/pluto_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "pluto", dst: "bin/pluto", mode: 0o755}

bins: ["bin"]

versions:
