schema: 2
name: kubectl-neat
description: Clean Kubernetes manifests for readability
homepage: https://github.com/itaysk/kubectl-neat
license: Apache-2.0

versionDiscovery:
  github:
    repo: itaysk/kubectl-neat
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/itaysk/kubectl-neat/releases/download/v{{.Version}}/kubectl-neat_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-neat", dst: "bin/kubectl-neat", mode: 0o755}

bins: ["bin"]

