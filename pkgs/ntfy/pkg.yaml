schema: 2
name: ntfy
description: Send push notifications to phone or desktop using PUT/POST
homepage: https://ntfy.sh
license: Apache-2.0

versionDiscovery:
  github:
    repo: binwiederhier/ntfy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

# macOS ships as a single universal "darwin_all" asset; Linux is per-arch.
artifact:
  url: "https://github.com/binwiederhier/ntfy/releases/download/v{{.Version}}/ntfy_{{.Version}}_{{if eq .OS \"darwin\"}}darwin_all{{else}}linux_{{.Arch}}{{end}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "ntfy", dst: "bin/ntfy", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2.27.0
    sha256:
      darwin/arm64: "bf74090dc1f5788a4e80984c58b62e04fa19dd7abc3e0915a0d4b92a31618e26"
      darwin/amd64: "bf74090dc1f5788a4e80984c58b62e04fa19dd7abc3e0915a0d4b92a31618e26"
      linux/arm64: "a1635f0a89e49c65676d6c580da5636ad62cf05b525651bd6b809a590cd2b70c"
      linux/amd64: "4b7220cb0e7673a66ace8e1368573c0df89888aafde6860ae3a48ae1174c8cee"
