schema: 2
name: kubectl-blame
description: Annotate Kubernetes fields with their last manager
homepage: https://github.com/knight42/kubectl-blame
license: Apache-2.0

versionDiscovery:
  github:
    repo: knight42/kubectl-blame
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/knight42/kubectl-blame/releases/download/v{{.Version}}/kubectl-blame-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-blame", dst: "bin/kubectl-blame", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.1.1
