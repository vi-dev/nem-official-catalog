name: mcp-grafana
description: MCP server for Grafana dashboards, datasources, and alerts
homepage: https://github.com/grafana/mcp-grafana
license: Apache-2.0

versionDiscovery:
  github:
    repo: grafana/mcp-grafana
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/grafana/mcp-grafana/releases/download/v{{.Version}}/mcp-grafana_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "mcp-grafana", dst: "bin/mcp-grafana", mode: 0o755}

bins: ["bin"]

