schema: 2
name: kubectl-secretdata
description: View decoded secret data across namespaces
homepage: https://github.com/keisku/kubectl-secretdata
license: MIT

versionDiscovery:
  github:
    repo: keisku/kubectl-secretdata
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/keisku/kubectl-secretdata/releases/download/v{{.Version}}/kubectl-secretdata_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-secretdata", dst: "bin/kubectl-secretdata", mode: 0o755}

bins: ["bin"]

versions:
