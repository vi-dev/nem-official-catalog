schema: 2
name: ali
description: HTTP load generator with real-time terminal plots
homepage: https://github.com/nakabonne/ali
license: MIT

versionDiscovery:
  github:
    repo: nakabonne/ali
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/nakabonne/ali/releases/download/v{{.Version}}/ali_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "ali", dst: "bin/ali", mode: 0o755}

bins: ["bin"]

