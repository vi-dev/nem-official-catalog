schema: 2
name: cue
description: Data constraint language for configuration and validation
homepage: https://cuelang.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: cue-lang/cue
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cue-lang/cue/releases/download/v{{.Version}}/cue_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cue", dst: "bin/cue", mode: 0o755}

bins: ["bin"]

