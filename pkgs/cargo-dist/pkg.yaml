schema: 2
name: cargo-dist
description: Builds and packages shippable artifacts for Rust projects
homepage: https://opensource.axo.dev/cargo-dist
license: Apache-2.0

versionDiscovery:
  github:
    repo: axodotdev/cargo-dist
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/axodotdev/cargo-dist/releases/download/v{{.Version}}/cargo-dist-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "dist", dst: "bin/dist", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.32.0
    sha256:
      darwin/arm64: "aa343b2ff78ec2981f17a65140250c5ad6062c74072163f68c5c2686d94763a7"
      darwin/amd64: "6243464a8389e006b9256ee548bc795638f1a17113c1b6669c0e05ce89fd05c5"
      linux/arm64: "16d4394af9b91366ca92cb4601a72dd0a209a49301ef535749e2141039e26ed6"
      linux/amd64: "0d9dc001b0e937e9cc18e0dc11784aa7a3fd566656b07828d5e1d10ce1c1c48c"
