schema: 2
name: duf
description: Disk usage viewer with a friendly UI
homepage: https://github.com/muesli/duf
license: MIT

versionDiscovery:
  github:
    repo: muesli/duf
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/muesli/duf/releases/download/v{{.Version}}/duf_{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "duf", dst: "bin/duf", mode: 0o755}

bins: ["bin"]

