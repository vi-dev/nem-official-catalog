schema: 2
name: jira-cli
description: Interactive command line client for Jira
homepage: https://github.com/ankitpokhrel/jira-cli
license: MIT

versionDiscovery:
  github:
    repo: ankitpokhrel/jira-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ankitpokhrel/jira-cli/releases/download/v{{.Version}}/jira_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}

bins: ["bin"]

