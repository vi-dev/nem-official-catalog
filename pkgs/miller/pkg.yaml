schema: 2
name: miller
description: Query and transform CSV, TSV, and JSON with mlr
homepage: https://miller.readthedocs.io
license: BSD-2-Clause

versionDiscovery:
  github:
    repo: johnkerl/miller
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/johnkerl/miller/releases/download/v{{.Version}}/miller-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "mlr", dst: "bin/mlr", mode: 0o755}

bins: ["bin"]

