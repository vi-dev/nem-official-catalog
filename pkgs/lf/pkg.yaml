schema: 2
name: lf
description: Terminal file manager
homepage: https://github.com/gokcehan/lf
license: MIT

# Upstream tags releases as r<n>, so versions are a plain revision number.
versionDiscovery:
  github:
    repo: gokcehan/lf
    filter: '^r\d+$'
    prefix: "r"

artifact:
  url: "https://github.com/gokcehan/lf/releases/download/r{{.Version}}/lf-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "lf", dst: "bin/lf", mode: 0o755}

bins: ["bin"]

versions:
  - version: 42
    sha256:
