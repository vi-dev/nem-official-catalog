schema: 2
name: gokey
description: Vaultless password manager deriving passwords on demand
homepage: https://github.com/cloudflare/gokey
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: cloudflare/gokey
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cloudflare/gokey/releases/download/v{{.Version}}/gokey-v{{.Version}}-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/gokey", mode: 0o755}

bins: ["bin"]

