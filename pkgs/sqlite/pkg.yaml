schema: 2

name: sqlite
description: SQLite database engine — sqlite3 CLI and libsqlite3
homepage: https://sqlite.org
license: blessing

platforms: [darwin/arm64, linux/arm64, linux/amd64]

deps:
  - name: readline
    kind: link
    compat: "8"
  - name: ncurses
    kind: link
    compat: "6"

bins: [bin]
libs: [lib]

versionDiscovery:
  github:
    repo: sqlite/sqlite
    filter: '^version-\d+\.\d+\.\d+$'
    prefix: "version-"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 3.53.4
    sourceSha256: "16bc1b2027ba2653e3d262e740376be23f67cad77865db814493267494326c3c"

# Canonical source; the build generates the amalgamation via bundled Jim-TCL.
build:
  deps:
    - pkgconf
    - name: readline
      kind: link
      compat: "8"
    - name: ncurses
      kind: link
      compat: "6"
  source:
    url: 'https://github.com/sqlite/sqlite/archive/refs/tags/version-{{.Version}}.tar.gz'
  output: out
  steps:
    - run: |
        set -e
        ./configure --prefix=/ --libdir=/lib \
          --with-readline-cflags="$(pkg-config --cflags readline)" \
          --with-readline-ldflags="$(pkg-config --libs readline)"
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
