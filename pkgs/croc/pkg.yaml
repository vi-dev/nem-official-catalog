schema: 2
name: croc
description: Send files between computers over an encrypted relay
homepage: https://github.com/schollz/croc
license: MIT

versionDiscovery:
  github:
    repo: schollz/croc
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/schollz/croc/releases/download/v{{.Version}}/croc_v{{.Version}}_{{if eq .OS \"darwin\"}}macOS{{else}}Linux{{end}}-{{replace (replace .Arch \"amd64\" \"64bit\") \"arm64\" \"ARM64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "croc", dst: "bin/croc", mode: 0o755}

bins: ["bin"]

