schema: 2
name: rclone
description: Sync files to and from cloud storage providers
homepage: https://rclone.org
license: MIT

versionDiscovery:
  github:
    repo: rclone/rclone
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/rclone/rclone/releases/download/v{{.Version}}/rclone-v{{.Version}}-{{replace .OS \"darwin\" \"osx\"}}-{{.Arch}}.zip"

install:
  - extract: {strip: 1}
  - copy: {src: "rclone", dst: "bin/rclone", mode: 0o755}

bins: ["bin"]

