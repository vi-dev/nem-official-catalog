schema: 2
name: corretto21
description: Amazon Corretto JDK 21 (LTS)
homepage: https://aws.amazon.com/corretto/
license: GPL-2.0-only WITH Classpath-exception-2.0

versionDiscovery:
  github:
    repo: corretto/corretto-21
    filter: '^21(\.\d+){4}$'

artifact:
  url: "https://corretto.aws/downloads/resources/{{.Version}}/amazon-corretto-{{.Version}}-{{replace .OS \"darwin\" \"macosx\"}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x64\"}}.tar.gz"

install:
  - extract: {strip: 1}

# Corretto macOS archives nest the JDK under Contents/Home; Linux archives
# don't. The entry absent on a platform contributes a dir that never exists.
bins: ["bin", "Contents/Home/bin"]

env:
  - name: JAVA_HOME
    value: "{{.InstallDir}}"
    platforms: [linux]
  - name: JAVA_HOME
    value: "{{.InstallDir}}/Contents/Home"
    platforms: [darwin]

