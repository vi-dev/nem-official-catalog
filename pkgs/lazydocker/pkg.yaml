schema: 2
name: lazydocker
description: Terminal UI for docker and docker-compose
homepage: https://github.com/jesseduffield/lazydocker
license: MIT

versionDiscovery:
  github:
    repo: jesseduffield/lazydocker
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/jesseduffield/lazydocker/releases/download/v{{.Version}}/lazydocker_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "lazydocker", dst: "bin/lazydocker", mode: 0o755}

bins: ["bin"]

versions:
