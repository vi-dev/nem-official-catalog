schema: 2
name: jid
description: Incremental JSON digger
homepage: https://github.com/simeji/jid
license: MIT

versionDiscovery:
  github:
    repo: simeji/jid
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/simeji/jid/releases/download/v{{.Version}}/jid_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "jid", dst: "bin/jid", mode: 0o755}

bins: ["bin"]

