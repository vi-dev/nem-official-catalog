schema: 2
name: telepresence
description: Local development against a remote Kubernetes cluster
homepage: https://www.telepresence.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: telepresenceio/telepresence
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/telepresenceio/telepresence/releases/download/v{{.Version}}/telepresence-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/telepresence", mode: 0o755}

bins: ["bin"]

