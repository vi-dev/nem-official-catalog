schema: 2
name: tanka
description: Jsonnet-based configuration utility for Kubernetes
homepage: https://tanka.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: grafana/tanka
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/grafana/tanka/releases/download/v{{.Version}}/tk-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/tk", mode: 0o755}

bins: ["bin"]

