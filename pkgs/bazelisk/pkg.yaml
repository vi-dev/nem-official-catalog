schema: 2
name: bazelisk
description: User-friendly launcher for the Bazel build system
homepage: https://github.com/bazelbuild/bazelisk
license: Apache-2.0

versionDiscovery:
  github:
    repo: bazelbuild/bazelisk
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/bazelbuild/bazelisk/releases/download/v{{.Version}}/bazelisk-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/bazelisk", mode: 0o755}
  - copy: {src: "{{.Artifact}}", dst: "bin/bazel", mode: 0o755}

bins: ["bin"]

