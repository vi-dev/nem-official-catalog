schema: 2
name: tailspin
description: Log file highlighter
homepage: https://github.com/bensadeh/tailspin
license: MIT

versionDiscovery:
  github:
    repo: bensadeh/tailspin
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/bensadeh/tailspin/releases/download/{{.Version}}/tailspin-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tspin", dst: "bin/tspin", mode: 0o755}

bins: ["bin"]

