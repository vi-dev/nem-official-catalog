schema: 2
name: bob
description: Version manager for Neovim
homepage: https://github.com/MordechaiHadad/bob
license: MIT

versionDiscovery:
  github:
    repo: MordechaiHadad/bob
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/MordechaiHadad/bob/releases/download/v{{.Version}}/bob-{{replace .OS \"darwin\" \"macos\"}}-{{replace (replace .Arch \"amd64\" \"x86_64\") \"arm64\" \"arm\"}}.zip"

install:
  - extract: {strip: 1}
  - copy: {src: "bob", dst: "bin/bob", mode: 0o755}

bins: ["bin"]

versions:
