schema: 2
name: kubectl-tree
description: Show hierarchies of Kubernetes objects
homepage: https://github.com/ahmetb/kubectl-tree
license: Apache-2.0

versionDiscovery:
  github:
    repo: ahmetb/kubectl-tree
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ahmetb/kubectl-tree/releases/download/v{{.Version}}/kubectl-tree_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-tree", dst: "bin/kubectl-tree", mode: 0o755}

bins: ["bin"]

