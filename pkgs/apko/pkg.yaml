schema: 2
name: apko
description: Build OCI images from apk packages
homepage: https://github.com/chainguard-dev/apko
license: Apache-2.0

versionDiscovery:
  github:
    repo: chainguard-dev/apko
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/chainguard-dev/apko/releases/download/v{{.Version}}/apko_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "apko", dst: "bin/apko", mode: 0o755}

bins: ["bin"]

