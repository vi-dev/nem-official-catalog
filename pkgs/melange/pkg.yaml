schema: 2
name: melange
description: Build apk packages from declarative pipelines
homepage: https://github.com/chainguard-dev/melange
license: Apache-2.0

versionDiscovery:
  github:
    repo: chainguard-dev/melange
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/chainguard-dev/melange/releases/download/v{{.Version}}/melange_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "melange", dst: "bin/melange", mode: 0o755}

bins: ["bin"]

