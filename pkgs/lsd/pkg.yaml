schema: 2
name: lsd
description: ls alternative with colors, icons, and tree view
homepage: https://github.com/lsd-rs/lsd
license: Apache-2.0

versionDiscovery:
  github:
    repo: lsd-rs/lsd
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/lsd-rs/lsd/releases/download/v{{.Version}}/lsd-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "lsd", dst: "bin/lsd", mode: 0o755}

bins: ["bin"]

versions:
  - version: 1.2.0
    sha256:
      darwin/arm64: "9e34a5d392ff913302098aad0543dafa1883c531eaf229b82f086c3fca675e3e"
      darwin/amd64: "00d3c50551b270bbdf7da97816e5ba7f5fd10294cd310165f7f8b5523e738b9c"
      linux/arm64: "642ecb1a763b9f790a99c83a1445c117a6813ed4edb5d498d4420423c6353eb8"
      linux/amd64: "77849da1210336534258551a581401ba19ae6b8d7b66a2a1feff148ad41e3814"
