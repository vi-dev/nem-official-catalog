schema: 2
name: tproxy
description: Proxy that inspects and analyzes TCP connections
homepage: https://github.com/kevwan/tproxy
license: MIT

versionDiscovery:
  github:
    repo: kevwan/tproxy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kevwan/tproxy/releases/download/v{{.Version}}/tproxy-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tproxy", dst: "bin/tproxy", mode: 0o755}

bins: ["bin"]

