schema: 2
name: packer
description: Automated machine image builder
homepage: https://developer.hashicorp.com/packer
license: BUSL-1.1

versionDiscovery:
  github:
    repo: hashicorp/packer
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://releases.hashicorp.com/packer/{{.Version}}/packer_{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "packer", dst: "bin/packer", mode: 0o755}

bins: ["bin"]

