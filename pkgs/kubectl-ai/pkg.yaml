schema: 2
name: kubectl-ai
description: AI agent for operating Kubernetes clusters
homepage: https://github.com/GoogleCloudPlatform/kubectl-ai
license: Apache-2.0

versionDiscovery:
  github:
    repo: GoogleCloudPlatform/kubectl-ai
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/GoogleCloudPlatform/kubectl-ai/releases/download/v{{.Version}}/kubectl-ai_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-ai", dst: "bin/kubectl-ai", mode: 0o755}

bins: ["bin"]

