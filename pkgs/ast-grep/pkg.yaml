schema: 2
name: ast-grep
description: Structural search, lint, and rewrite tool for code
homepage: https://ast-grep.github.io
license: MIT

versionDiscovery:
  github:
    repo: ast-grep/ast-grep
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/ast-grep/ast-grep/releases/download/{{.Version}}/app-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "ast-grep", dst: "bin/ast-grep", mode: 0o755}
  - copy: {src: "sg", dst: "bin/sg", mode: 0o755}

bins: ["bin"]

versions:
