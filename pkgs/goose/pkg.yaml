schema: 2
name: goose
description: Database migration tool with embedded support
homepage: https://github.com/pressly/goose
license: MIT

versionDiscovery:
  github:
    repo: pressly/goose
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pressly/goose/releases/download/v{{.Version}}/goose_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/goose", mode: 0o755}

bins: ["bin"]

