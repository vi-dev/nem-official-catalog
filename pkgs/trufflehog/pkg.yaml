schema: 2
name: trufflehog
description: Find and verify leaked credentials
homepage: https://github.com/trufflesecurity/trufflehog
license: AGPL-3.0-only

versionDiscovery:
  github:
    repo: trufflesecurity/trufflehog
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/trufflesecurity/trufflehog/releases/download/v{{.Version}}/trufflehog_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "trufflehog", dst: "bin/trufflehog", mode: 0o755}

bins: ["bin"]

