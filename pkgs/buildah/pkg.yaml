schema: 2

name: buildah
description: Tool for building OCI container images
homepage: https://buildah.io
license: Apache-2.0

platforms: [linux/arm64, linux/amd64]

deps:
  - name: gpgme
    kind: link
    compat: "1"
  - name: libassuan
    kind: link
    compat: "3"
  - name: libgpg-error
    kind: link
    compat: "1"
  - name: libseccomp
    kind: link
    compat: "2"
  - name: crun
    kind: run
bins: [bin]

versionDiscovery:
  github:
    repo: podman-container-tools/buildah
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.45.0
    sourceSha256: "d2bc03332c9f6ad5fcc210c68ad3190fe11d358214c88fb12a233f5045d5eddd"

build:
  deps:
    - go
    - pkgconf
    - name: gpgme
      kind: link
      compat: "1"
    - name: libassuan
      kind: link
      compat: "3"
    - name: libgpg-error
      kind: link
      compat: "1"
    - name: libseccomp
      kind: link
      compat: "2"
  source:
    url: 'https://github.com/podman-container-tools/buildah/archive/refs/tags/v{{.Version}}.tar.gz'
  output: out
  steps:
    - run: CGO_ENABLED=1 go build -trimpath -tags "seccomp exclude_graphdriver_btrfs" -ldflags "-s -w" -o "$NEM_OUTPUT/bin/buildah" ./cmd/buildah

test:
  # Image work needs unshare(CLONE_NEWUSER), which no CI container grants.
  - run: buildah --version | grep -q "$NEM_VERSION"
  - run: |
      set -e
      buildah --help >/dev/null
      buildah build --help >/dev/null
      out=$(ldd "$NEM_PREFIX/bin/buildah")
      printf '%s' "$out" | grep -q libgpgme
      printf '%s' "$out" | grep -q libseccomp
      ! printf '%s' "$out" | grep -q 'not found'
