schema: 2
name: sccache
description: Compiler cache with local and cloud storage backends
homepage: https://github.com/mozilla/sccache
license: Apache-2.0

versionDiscovery:
  github:
    repo: mozilla/sccache
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/mozilla/sccache/releases/download/v{{.Version}}/sccache-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "sccache", dst: "bin/sccache", mode: 0o755}

bins: ["bin"]

versions:
