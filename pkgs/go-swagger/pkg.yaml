schema: 2
name: go-swagger
description: Swagger 2.0 toolkit for Go APIs
homepage: https://goswagger.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: go-swagger/go-swagger
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/go-swagger/go-swagger/releases/download/v{{.Version}}/swagger_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "swagger", dst: "bin/swagger", mode: 0o755}

bins: ["bin"]

