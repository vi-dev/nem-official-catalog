schema: 2
name: reviewdog
description: Post code analysis results as pull request review comments
homepage: https://github.com/reviewdog/reviewdog
license: MIT

versionDiscovery:
  github:
    repo: reviewdog/reviewdog
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/reviewdog/reviewdog/releases/download/v{{.Version}}/reviewdog_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "reviewdog", dst: "bin/reviewdog", mode: 0o755}

bins: ["bin"]

versions:
