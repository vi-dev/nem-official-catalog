schema: 2
name: vcluster
description: Create virtual Kubernetes clusters
homepage: https://www.vcluster.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: loft-sh/vcluster
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/loft-sh/vcluster/releases/download/v{{.Version}}/vcluster-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/vcluster", mode: 0o755}

bins: ["bin"]

