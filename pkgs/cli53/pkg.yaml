schema: 2
name: cli53
description: Command line tool for Amazon Route 53
homepage: https://github.com/barnybug/cli53
license: MIT

versionDiscovery:
  github:
    repo: barnybug/cli53
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/barnybug/cli53/releases/download/v{{.Version}}/cli53-{{replace .OS \"darwin\" \"mac\"}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/cli53", mode: 0o755}

bins: ["bin"]

