schema: 2
name: procs
description: Modern replacement for ps written in Rust
homepage: https://github.com/dalance/procs
license: MIT

versionDiscovery:
  github:
    repo: dalance/procs
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/dalance/procs/releases/download/v{{.Version}}/procs-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace .OS \"darwin\" \"mac\"}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "procs", dst: "bin/procs", mode: 0o755}

bins: ["bin"]

versions:
