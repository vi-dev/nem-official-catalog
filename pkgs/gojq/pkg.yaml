schema: 2
name: gojq
description: Pure Go implementation of jq
homepage: https://github.com/itchyny/gojq
license: MIT

versionDiscovery:
  github:
    repo: itchyny/gojq
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/itchyny/gojq/releases/download/v{{.Version}}/gojq_v{{.Version}}_{{.OS}}_{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 1}
  - copy: {src: "gojq", dst: "bin/gojq", mode: 0o755}

bins: ["bin"]

versions:
