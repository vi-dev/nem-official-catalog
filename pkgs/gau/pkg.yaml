schema: 2
name: gau
description: Fetch known URLs from Wayback Machine, OTX, and Common Crawl
homepage: https://github.com/lc/gau
license: MIT

versionDiscovery:
  github:
    repo: lc/gau
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/lc/gau/releases/download/v{{.Version}}/gau_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gau", dst: "bin/gau", mode: 0o755}

bins: ["bin"]

