schema: 2
name: caddy
description: Web server with automatic HTTPS
homepage: https://caddyserver.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: caddyserver/caddy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/caddyserver/caddy/releases/download/v{{.Version}}/caddy_{{.Version}}_{{replace .OS \"darwin\" \"mac\"}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "caddy", dst: "bin/caddy", mode: 0o755}

bins: ["bin"]

