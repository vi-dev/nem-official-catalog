schema: 2
name: age
description: Simple, modern, and secure file encryption tool
homepage: https://filippo.io/age
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: FiloSottile/age
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/FiloSottile/age/releases/download/v{{.Version}}/age-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

# The archive bundles age, age-keygen, and age-plugin-* helpers whose set
# varies by release; age discovers plugins via PATH, so the whole install
# root is exposed rather than copying a fixed list.
install:
  - extract: {strip: 1}

bins: ["."]

versions:
  - version: 1.3.2
    sha256:
      darwin/arm64: "e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5"
      darwin/amd64: "1d1e4bc66e1427edad7739ae7616157de0e79db8b6d2a1497d7d9925fb06a539"
      linux/arm64: "6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4"
      linux/amd64: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
  - version: 1.3.1
    sha256:
      darwin/arm64: "01120ea2cbf0463d4c6bd767f99f3271bbed1cdc8a9aa718a76ba1fe4f01998b"
      darwin/amd64: "2b233301ad21ab7b1eabd9ae1198a164005fa4928fcdd745d47c39f8593209d7"
      linux/arm64: "c6878a324421b69e3e20b00ba17c04bc5c6dab0030cfe55bf8f68fa8d9e9093a"
      linux/amd64: "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377"
  - version: 1.3.0
    sha256:
      darwin/arm64: "4cd58304a79fbcd554d5ba99ec1cba872cf7ef84b9ac34ebbc5e77bd1fa9f5f6"
      darwin/amd64: "d4901f105731bdedb19cb70b5608f7c8db09349dd0b57017cef8c48a31819462"
      linux/arm64: "5c78a4de6aa89e86045e4c05fec5773f3c419a5c209cd7cb381fec0f5e8fa936"
      linux/amd64: "2635f17e469b8c829055151dcbf77effe1fbefe182cb7b308aee5d0e5d923aae"

test:
  - run: age --version | grep -q "$NEM_VERSION"
  # bins is the install root, so the keygen helper beside age must resolve too.
  - run: |
      set -e
      age-keygen -o key.txt 2>/dev/null
      pub=$(grep '^# public key: ' key.txt | cut -d' ' -f4)
      printf 'secret' | age -r "$pub" -o msg.age
      [ "$(age -d -i key.txt msg.age)" = secret ]
