schema: 2
name: jqp
description: TUI playground to experiment with jq
homepage: https://github.com/noahgorstein/jqp
license: MIT

versionDiscovery:
  github:
    repo: noahgorstein/jqp
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/noahgorstein/jqp/releases/download/v{{.Version}}/jqp_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "jqp", dst: "bin/jqp", mode: 0o755}

bins: ["bin"]

versions:
