schema: 2
name: presenterm
description: Markdown terminal slideshow tool
homepage: https://github.com/mfontanini/presenterm
license: BSD-2-Clause

versionDiscovery:
  github:
    repo: mfontanini/presenterm
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/mfontanini/presenterm/releases/download/v{{.Version}}/presenterm-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "presenterm", dst: "bin/presenterm", mode: 0o755}

bins: ["bin"]

versions:
