schema: 2
name: glow
description: Render Markdown in the terminal
homepage: https://github.com/charmbracelet/glow
license: MIT

versionDiscovery:
  github:
    repo: charmbracelet/glow
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/charmbracelet/glow/releases/download/v{{.Version}}/glow_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "glow", dst: "bin/glow", mode: 0o755}

bins: ["bin"]

versions:
  - version: 3.0.0
    sha256:
      darwin/arm64: "4b8a9a32412c0525e4c239e65171706fc5beb6d423608d99fe16788d47b345d3"
