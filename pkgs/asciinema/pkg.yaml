schema: 2
name: asciinema
description: Terminal session recorder, streamer and player
homepage: https://asciinema.org
license: GPL-3.0

versionDiscovery:
  github:
    repo: asciinema/asciinema
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/asciinema/asciinema/releases/download/v{{.Version}}/asciinema-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/asciinema", mode: 0o755}

bins: ["bin"]

versions:
