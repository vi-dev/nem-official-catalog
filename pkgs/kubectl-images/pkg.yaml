schema: 2
name: kubectl-images
description: Show container images used in a cluster
homepage: https://github.com/chenjiandongx/kubectl-images
license: MIT

versionDiscovery:
  github:
    repo: chenjiandongx/kubectl-images
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/chenjiandongx/kubectl-images/releases/download/v{{.Version}}/kubectl-images_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-images", dst: "bin/kubectl-images", mode: 0o755}

bins: ["bin"]

