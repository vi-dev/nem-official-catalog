schema: 2

name: lz4
description: LZ4 extremely fast compression CLI and liblz4
homepage: https://lz4.org
license: BSD-2-Clause AND GPL-2.0-or-later

platforms: [darwin/arm64, linux/arm64, linux/amd64]

bins: [bin]
libs: [lib]

versionDiscovery:
  github:
    repo: lz4/lz4
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.10.0
    sourceSha256: "537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b"

build:
  source:
    url: 'https://github.com/lz4/lz4/releases/download/v{{.Version}}/lz4-{{.Version}}.tar.gz'
  output: out
  steps:
    - run: make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)" install PREFIX=/ DESTDIR="$NEM_OUTPUT"
