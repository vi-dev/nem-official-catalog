schema: 2
name: clusterctl
description: CLI for Cluster API lifecycle management
homepage: https://cluster-api.sigs.k8s.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubernetes-sigs/cluster-api
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubernetes-sigs/cluster-api/releases/download/v{{.Version}}/clusterctl-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/clusterctl", mode: 0o755}

bins: ["bin"]

