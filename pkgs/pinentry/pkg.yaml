schema: 2

name: pinentry
description: GnuPG passphrase entry dialog (tty variant)
homepage: https://gnupg.org/software/pinentry/
license: GPL-2.0-or-later

platforms: [darwin/arm64, linux/arm64, linux/amd64]

deps:
  - name: libassuan
    kind: link
    compat: "3"
  - name: ncurses
    kind: link
    compat: "6"
  - name: libgpg-error
    kind: link
    compat: "1"

bins: [bin]

versionDiscovery:
  http:
    url: https://gnupg.org/ftp/gcrypt/pinentry/
    filter: 'pinentry-(\d+\.\d+\.\d+)\.tar\.bz2'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.3.3
    sourceSha256: "c2970f16d6afb66ecddfca767d743936c86239bff936eed7fd7597a678414b63"

build:
  deps:
    - pkgconf
    - name: libassuan
      kind: link
      compat: "3"
    - name: ncurses
      kind: link
      compat: "6"
    - name: libgpg-error
      kind: link
      compat: "1"
  source:
    url: 'https://gnupg.org/ftp/gcrypt/pinentry/pinentry-{{.Version}}.tar.bz2'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        # macOS's system iconv fails gnulib's "working iconv" run-test;
        # without the preset the curses pinentry links without -liconv.
        ./configure --prefix=/ --libdir=/lib --disable-dependency-tracking \
          --enable-pinentry-tty --enable-pinentry-curses --enable-fallback-curses \
          am_cv_func_iconv_works=yes
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
