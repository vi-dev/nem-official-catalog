schema: 2
name: lychee
description: Fast link checker for Markdown, HTML, and more
homepage: https://lychee.cli.rs
license: MIT

versionDiscovery:
  github:
    repo: lycheeverse/lychee
    filter: '^lychee-v\d+\.\d+\.\d+$'
    prefix: "lychee-v"

artifact:
  url: "https://github.com/lycheeverse/lychee/releases/download/lychee-v{{.Version}}/lychee-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "lychee", dst: "bin/lychee", mode: 0o755}

bins: ["bin"]

versions:
