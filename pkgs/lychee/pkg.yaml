      darwin/amd64: "887503a9cff667d322b8d0892b40bf49976eb9507af8483220a3706cdad55978"
      linux/arm64: "5d0b0e3aeab240f41920c633a6eaf97599be6eedda034b36e858ede7dba5e535"
