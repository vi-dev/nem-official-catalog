schema: 2
name: copa
description: Patch container image vulnerabilities directly
homepage: https://project-copacetic.github.io/copacetic/
license: Apache-2.0

versionDiscovery:
  github:
    repo: project-copacetic/copacetic
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/project-copacetic/copacetic/releases/download/v{{.Version}}/copa_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "copa", dst: "bin/copa", mode: 0o755}

bins: ["bin"]

