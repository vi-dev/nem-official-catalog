schema: 2
name: conftest
description: Test structured configuration data using Open Policy Agent
homepage: https://www.conftest.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: open-policy-agent/conftest
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/open-policy-agent/conftest/releases/download/v{{.Version}}/conftest_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "conftest", dst: "bin/conftest", mode: 0o755}

bins: ["bin"]

