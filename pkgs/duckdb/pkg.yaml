schema: 2
name: duckdb
description: In-process analytical SQL database CLI
homepage: https://duckdb.org
license: MIT

versionDiscovery:
  github:
    repo: duckdb/duckdb
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/duckdb/duckdb/releases/download/v{{.Version}}/duckdb_cli-{{replace .OS \"darwin\" \"osx\"}}-{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "duckdb", dst: "bin/duckdb", mode: 0o755}

bins: ["bin"]

