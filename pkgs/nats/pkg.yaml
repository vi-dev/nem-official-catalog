schema: 2
name: nats
description: CLI for the NATS messaging system
homepage: https://nats.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: nats-io/natscli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/nats-io/natscli/releases/download/v{{.Version}}/nats-{{.Version}}-{{.OS}}-{{.Arch}}.zip"

install:
  - extract: {strip: 1}
  - copy: {src: "nats", dst: "bin/nats", mode: 0o755}

bins: ["bin"]

versions:
