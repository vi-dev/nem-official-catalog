schema: 2
name: marmot
description: Multi-writer replication layer for SQLite over NATS JetStream
homepage: https://github.com/maxpert/marmot
license: MIT

versionDiscovery:
  github:
    repo: maxpert/marmot
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/maxpert/marmot/releases/download/v{{.Version}}/marmot-v{{.Version}}-{{.OS}}-{{.Arch}}{{if eq .OS \"linux\"}}-static{{end}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "marmot", dst: "bin/marmot", mode: 0o755}

bins: ["bin"]

versions:
