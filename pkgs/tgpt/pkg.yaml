schema: 2
name: tgpt
description: Terminal AI chatbot client that needs no API keys
homepage: https://github.com/aandrew-me/tgpt
license: GPL-3.0

versionDiscovery:
  github:
    repo: aandrew-me/tgpt
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/aandrew-me/tgpt/releases/download/v{{.Version}}/tgpt-{{replace .OS \"darwin\" \"mac\"}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/tgpt", mode: 0o755}

bins: ["bin"]

