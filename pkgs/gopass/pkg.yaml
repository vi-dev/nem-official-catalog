schema: 2
name: gopass
description: Command-line password manager for teams
homepage: https://www.gopass.pw/
license: MIT

versionDiscovery:
  github:
    repo: gopasspw/gopass
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/gopasspw/gopass/releases/download/v{{.Version}}/gopass-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gopass", dst: "bin/gopass", mode: 0o755}

bins: ["bin"]

