schema: 2
name: diun
description: Notifications when an image is updated on a container registry
homepage: https://crazymax.dev/diun/
license: MIT

versionDiscovery:
  github:
    repo: crazy-max/diun
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/crazy-max/diun/releases/download/v{{.Version}}/diun_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "diun", dst: "bin/diun", mode: 0o755}

bins: ["bin"]

