schema: 2
name: kaf
description: Command-line client for Apache Kafka
homepage: https://github.com/birdayz/kaf
license: Apache-2.0

versionDiscovery:
  github:
    repo: birdayz/kaf
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/birdayz/kaf/releases/download/v{{.Version}}/kaf_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kaf", dst: "bin/kaf", mode: 0o755}

bins: ["bin"]

versions:
