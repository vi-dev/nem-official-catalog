schema: 2
name: talosctl
description: CLI for Talos Linux Kubernetes clusters
homepage: https://www.talos.dev
license: MPL-2.0

versionDiscovery:
  github:
    repo: siderolabs/talos
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/siderolabs/talos/releases/download/v{{.Version}}/talosctl-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/talosctl", mode: 0o755}

bins: ["bin"]

