schema: 2
name: websocat
description: Command-line client for WebSockets, like netcat for ws://
homepage: https://github.com/vi/websocat
license: MIT

versionDiscovery:
  github:
    repo: vi/websocat
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/vi/websocat/releases/download/v{{.Version}}/websocat.{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/websocat", mode: 0o755}

bins: ["bin"]

versions:
