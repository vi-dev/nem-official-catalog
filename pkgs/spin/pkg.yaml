schema: 2
name: spin
description: Developer tool for serverless WebAssembly applications
homepage: https://spinframework.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: spinframework/spin
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/spinframework/spin/releases/download/v{{.Version}}/spin-v{{.Version}}-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"arm64\" \"aarch64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "spin", dst: "bin/spin", mode: 0o755}

bins: ["bin"]

