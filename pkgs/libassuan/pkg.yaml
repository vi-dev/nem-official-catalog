schema: 2

name: libassuan
description: IPC library used by the GnuPG components to talk to their helpers
homepage: https://www.gnupg.org/software/libassuan/
license: LGPL-2.1-or-later

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# compat "1" floats within libgpg-error 1.x, all sharing the libgpg-error.0
# soname (soname number is independent of the version).
deps:
  - name: libgpg-error
    kind: link
    compat: "1"

libs: [lib]

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: v3.0.1
    sourceSha256: "c8f0f42e6103dea4b1a6a483cb556654e97302c7465308f58363778f95f194b1"

build:
  deps:
    - name: libgpg-error
      kind: link
      compat: "1"
  source:
    url: 'https://gnupg.org/ftp/gcrypt/libassuan/libassuan-{{trimPrefix .Version "v"}}.tar.bz2'
  output: out
  steps:
    # configure finds libgpg-error via its gpgrt-config, which a link dep's bin/
    # doesn't put on PATH; derive the prefix from the injected -I flag and add
    # its bin/. -fgnu89-inline (macOS only) stops the stdio extern-inline __sputc
    # becoming a duplicate global under the modern linker.
    - run: |
        set -e
        lge=
        for t in $CPPFLAGS; do
          case "$t" in
            -I*/include) p=${t#-I}; p=${p%/include}; case "$p" in *libgpg-error*) lge=$p ;; esac ;;
          esac
        done
        export PATH="$lge/bin:$PATH"
        cflags="-O2"
        case "$NEM_OS" in darwin) cflags="-fgnu89-inline -O2" ;; esac
        ./configure --prefix=/ --libdir=/lib --disable-dependency-tracking --enable-shared --disable-static --disable-doc \
          --with-libgpg-error-prefix="$lge" \
          CFLAGS="$CFLAGS $cflags"
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
    - run: |
        case "$NEM_OS" in
        darwin)
          cd "$NEM_OUTPUT"
          install_name_tool -id @rpath/libassuan.9.dylib lib/libassuan.9.dylib
          codesign -f -s - lib/libassuan.9.dylib
          ;;
        esac
        rm -f "$NEM_OUTPUT/lib"/*.la
