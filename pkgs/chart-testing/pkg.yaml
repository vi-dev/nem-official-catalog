schema: 2
name: chart-testing
description: Lint and test Helm charts (ct)
homepage: https://github.com/helm/chart-testing
license: Apache-2.0

versionDiscovery:
  github:
    repo: helm/chart-testing
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/helm/chart-testing/releases/download/v{{.Version}}/chart-testing_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  # etc/ holds the default lint schemas; kept beside bin/
  - extract: {strip: 0}
  - copy: {src: "ct", dst: "bin/ct", mode: 0o755}

bins: ["bin"]

versions:
