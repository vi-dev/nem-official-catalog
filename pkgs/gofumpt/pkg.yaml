schema: 2
name: gofumpt
description: Stricter gofmt with additional formatting rules
homepage: https://github.com/mvdan/gofumpt
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: mvdan/gofumpt
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/mvdan/gofumpt/releases/download/v{{.Version}}/gofumpt_v{{.Version}}_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/gofumpt", mode: 0o755}

bins: ["bin"]

