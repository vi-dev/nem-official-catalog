schema: 2
name: hl
description: Log viewer that renders JSON and logfmt logs as human-readable text
homepage: https://github.com/pamburus/hl
license: MIT

versionDiscovery:
  github:
    repo: pamburus/hl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pamburus/hl/releases/download/v{{.Version}}/hl-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"amd64\" \"x86_64\"}}{{if eq .OS \"linux\"}}-gnu{{end}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "hl", dst: "bin/hl", mode: 0o755}

bins: ["bin"]

versions:
