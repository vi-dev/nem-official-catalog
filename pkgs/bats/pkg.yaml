schema: 2
name: bats
description: Bash automated testing system
homepage: https://github.com/bats-core/bats-core
license: MIT

versionDiscovery:
  github:
    repo: bats-core/bats-core
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/bats-core/bats-core/archive/refs/tags/v{{.Version}}.tar.gz"

install:
  # bats resolves lib/ and libexec/ relative to bin/bats, so keep the full tree.
  - extract: {strip: 1}

bins: ["bin"]

