schema: 2
name: nextest
description: Next-generation test runner for Rust
homepage: https://nexte.st
license: Apache-2.0

versionDiscovery:
  github:
    repo: nextest-rs/nextest
    filter: '^cargo-nextest-\d+\.\d+\.\d+$'
    prefix: "cargo-nextest-"

artifact:
  url: "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-{{.Version}}/cargo-nextest-{{.Version}}-{{if eq .OS \"darwin\"}}universal-apple-darwin{{else}}{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-unknown-linux-gnu{{end}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cargo-nextest", dst: "bin/cargo-nextest", mode: 0o755}

bins: ["bin"]

versions:
