schema: 2
name: viddy
description: Watch command with time machine and pager
homepage: https://github.com/sachaos/viddy
license: MIT

versionDiscovery:
  github:
    repo: sachaos/viddy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sachaos/viddy/releases/download/v{{.Version}}/viddy-v{{.Version}}-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "viddy", dst: "bin/viddy", mode: 0o755}

bins: ["bin"]

