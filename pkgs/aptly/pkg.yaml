schema: 2
name: aptly
description: Debian repository management tool
homepage: https://www.aptly.info
license: MIT

versionDiscovery:
  github:
    repo: aptly-dev/aptly
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/aptly-dev/aptly/releases/download/v{{.Version}}/aptly_{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 1}
  - copy: {src: "aptly", dst: "bin/aptly", mode: 0o755}

bins: ["bin"]

