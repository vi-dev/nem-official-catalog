schema: 2
name: pgrok
description: Multi-tenant HTTP/TCP reverse tunnel over SSH remote port forwarding
homepage: https://github.com/pgrok/pgrok
license: MIT

versionDiscovery:
  github:
    repo: pgrok/pgrok
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pgrok/pgrok/releases/download/v{{.Version}}/pgrok_{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "pgrok", dst: "bin/pgrok", mode: 0o755}

bins: ["bin"]

versions:
