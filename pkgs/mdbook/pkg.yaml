schema: 2
name: mdbook
description: Create books from Markdown
homepage: https://rust-lang.github.io/mdBook/
license: MPL-2.0

versionDiscovery:
  github:
    repo: rust-lang/mdBook
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/rust-lang/mdBook/releases/download/v{{.Version}}/mdbook-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "mdbook", dst: "bin/mdbook", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.5.4
    sha256:
      darwin/arm64: "03e8a6d8b13a2971e0b3280affd03b388373c1485e26f73407c3a76b0b1838df"
