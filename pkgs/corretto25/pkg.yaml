schema: 2
name: corretto25
description: Amazon Corretto JDK 25 (LTS)
homepage: https://aws.amazon.com/corretto/
license: GPL-2.0-only WITH Classpath-exception-2.0

versionDiscovery:
  github:
    repo: corretto/corretto-25
    filter: '^25(\.\d+){4}$'

artifact:
  url: "https://corretto.aws/downloads/resources/{{.Version}}/amazon-corretto-{{.Version}}-{{replace .OS \"darwin\" \"macosx\"}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x64\"}}.tar.gz"

install:
  - extract: {strip: 1}

# Corretto macOS archives nest the JDK under Contents/Home; Linux archives
# don't. The entry absent on a platform contributes a dir that never exists.
bins: ["bin", "Contents/Home/bin"]

env:
  - name: JAVA_HOME
    value: "{{.InstallDir}}"
    platforms: [linux]
  - name: JAVA_HOME
    value: "{{.InstallDir}}/Contents/Home"
    platforms: [darwin]

versions:
  - version: 25.0.4.7.1
    sha256:
      darwin/arm64: "41e185be6b230cff4e9c85d33f9b092274a32e42113087f26d3b2e4f7909ab78"
      darwin/amd64: "840b857016f2ab1a60a2aa5a68584b1da55f4ab953c1e2a207bde0a5114f683d"
      linux/arm64: "90a07c1c693ac9333a8a6ec79432f0d13c0564fec6617b0222d43f86858f65b8"
      linux/amd64: "1d03a3bd5091728492d92f0ef341aca7d8885ece9a150119558f3e3d62b58745"
