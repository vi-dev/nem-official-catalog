schema: 2
name: kcl
description: Command line interface for the KCL configuration language
homepage: https://kcl-lang.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kcl-lang/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kcl-lang/cli/releases/download/v{{.Version}}/kcl-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kcl", dst: "bin/kcl", mode: 0o755}

bins: ["bin"]

