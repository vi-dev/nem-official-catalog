    sha256:
      darwin/arm64: "b57928e246617df73cb1b2157f31f507dcbde6ae12e828cc53dde0e40e05bbbb"
      darwin/amd64: "55e95bb7a8d61ae6919eaaf96f260f0836f5b34c1b0f7731e38be803f6984367"
      linux/arm64: "bc4732df4754748e9bf296aa3832ec019f798afb399f1279b72ed37b6e04525c"
      linux/amd64: "cac7c4670d69444db120edb21fe06c97ba8c80dcc52279957c8dd18f05fb0c06"
