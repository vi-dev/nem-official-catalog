schema: 2
name: dnote
description: Command line notebook for capturing notes
homepage: https://github.com/dnote/dnote
license: Apache-2.0

versionDiscovery:
  github:
    repo: dnote/dnote
    filter: '^cli-v\d+\.\d+\.\d+$'
    prefix: "cli-v"

artifact:
  url: "https://github.com/dnote/dnote/releases/download/cli-v{{.Version}}/dnote_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "dnote", dst: "bin/dnote", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.16.0
    sha256:
