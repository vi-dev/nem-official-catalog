schema: 2
name: portr
description: Expose local http, tcp or websocket connections to the internet
homepage: https://github.com/amalshaji/portr
license: AGPL-3.0

versionDiscovery:
  github:
    repo: amalshaji/portr
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/amalshaji/portr/releases/download/v{{.Version}}/portr_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "portr", dst: "bin/portr", mode: 0o755}

bins: ["bin"]

