schema: 2
name: kubectl-df-pv
description: Show disk usage of persistent volumes
homepage: https://github.com/yashbhutwala/kubectl-df-pv
license: Apache-2.0

versionDiscovery:
  github:
    repo: yashbhutwala/kubectl-df-pv
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/yashbhutwala/kubectl-df-pv/releases/download/v{{.Version}}/kubectl-df-pv_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  # kubectl maps "df-pv" to an underscore executable name
  - copy: {src: "df-pv", dst: "bin/kubectl-df_pv", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.5.0
    sha256:
      darwin/arm64: "d802c7483703c8b3b29395540e13ef29991268d53dc29623d54fa25f906611fc"
