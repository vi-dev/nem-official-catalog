      linux/arm64: "9fa44482ee09e86ae1d6e8ed11632eab0048ae920b40a9ddfdf03b246adb731d"
      linux/amd64: "6783abeb2d38870e3992b7e88fd62c85e9a7ec022ff5101477c7f38dea8beefe"
