schema: 2
name: zola
description: Fast static site generator
homepage: https://www.getzola.org
license: MIT

versionDiscovery:
  github:
    repo: getzola/zola
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/getzola/zola/releases/download/v{{.Version}}/zola-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "zola", dst: "bin/zola", mode: 0o755}

bins: ["bin"]

