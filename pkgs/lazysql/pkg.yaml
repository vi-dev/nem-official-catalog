schema: 2
name: lazysql
description: Terminal UI for managing SQL databases
homepage: https://github.com/jorgerojas26/lazysql
license: MIT

versionDiscovery:
  github:
    repo: jorgerojas26/lazysql
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/jorgerojas26/lazysql/releases/download/v{{.Version}}/lazysql_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "lazysql", dst: "bin/lazysql", mode: 0o755}

bins: ["bin"]

