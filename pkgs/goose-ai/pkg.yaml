schema: 2
name: goose-ai
description: Extensible AI agent that runs and edits code locally
homepage: https://goose-docs.ai
license: Apache-2.0

versionDiscovery:
  github:
    repo: aaif-goose/goose
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/aaif-goose/goose/releases/download/v{{.Version}}/goose-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.bz2"

install:
  - extract: {strip: 0}
  - copy: {src: "goose", dst: "bin/goose", mode: 0o755}

bins: ["bin"]

versions:
