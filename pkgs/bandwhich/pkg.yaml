schema: 2
name: bandwhich
description: Terminal bandwidth utilization monitor
homepage: https://github.com/imsnif/bandwhich
license: MIT

versionDiscovery:
  github:
    repo: imsnif/bandwhich
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/imsnif/bandwhich/releases/download/v{{.Version}}/bandwhich-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "bandwhich", dst: "bin/bandwhich", mode: 0o755}

bins: ["bin"]

versions:
