schema: 2
name: gh-dash
description: Terminal UI dashboard for GitHub pull requests and issues
homepage: https://gh-dash.dev
license: MIT

versionDiscovery:
  github:
    repo: dlvhdr/gh-dash
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/dlvhdr/gh-dash/releases/download/v{{.Version}}/gh-dash_v{{.Version}}_{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/gh-dash", mode: 0o755}

bins: ["bin"]

