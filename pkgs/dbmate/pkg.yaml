schema: 2
name: dbmate
description: Framework-agnostic database migration tool
homepage: https://github.com/amacneil/dbmate
license: MIT

versionDiscovery:
  github:
    repo: amacneil/dbmate
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/amacneil/dbmate/releases/download/v{{.Version}}/dbmate-{{replace .OS \"darwin\" \"macos\"}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/dbmate", mode: 0o755}

bins: ["bin"]

