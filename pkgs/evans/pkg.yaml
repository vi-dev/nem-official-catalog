schema: 2
name: evans
description: Expressive gRPC client with REPL
homepage: https://github.com/ktr0731/evans
license: MIT

versionDiscovery:
  github:
    repo: ktr0731/evans
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ktr0731/evans/releases/download/v{{.Version}}/evans_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "evans", dst: "bin/evans", mode: 0o755}

bins: ["bin"]

