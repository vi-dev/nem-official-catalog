schema: 2
name: revive
description: Configurable and extensible linter for Go
homepage: https://revive.run
license: MIT

versionDiscovery:
  github:
    repo: mgechev/revive
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/mgechev/revive/releases/download/v{{.Version}}/revive_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "revive", dst: "bin/revive", mode: 0o755}

bins: ["bin"]

