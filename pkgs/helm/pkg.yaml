schema: 2
name: helm
description: The Kubernetes package manager
homepage: https://helm.sh
license: Apache-2.0

versionDiscovery:
  github:
    repo: helm/helm
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://get.helm.sh/helm-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "helm", dst: "bin/helm", mode: 0o755}

bins: ["bin"]

