schema: 2

name: meson
description: Fast build system generator, driving ninja
homepage: https://mesonbuild.com
license: Apache-2.0

platforms: [darwin/arm64, linux/arm64, linux/amd64]

deps:
  - name: python
    kind: run

bins: [bin]

versionDiscovery:
  github:
    repo: mesonbuild/meson
    filter: '^\d+\.\d+\.\d+$'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.12.0
    sourceSha256: "88afe0c20e52030218924ac37d0c81c59b4b5f3ae3752c8c6d7470c7d365886c"

build:
  source:
    url: 'https://github.com/mesonbuild/meson/releases/download/{{.Version}}/meson-{{.Version}}.tar.gz'
  output: out
  steps:
    # Pure Python: stage the tree and drive it through the python run dep,
    # resolved from PATH so the wrapper carries no absolute path.
    - run: |
        set -e
        mkdir -p "$NEM_OUTPUT/libexec/meson" "$NEM_OUTPUT/bin"
        # $NEM_OUTPUT lives inside the source dir, so exclude it from the copy.
        tar --exclude=./out -cf - . | (cd "$NEM_OUTPUT/libexec/meson" && tar -xf -)
        printf '#!/bin/sh\nexec python3 "$(cd "$(dirname "$0")/../libexec/meson" && pwd)/meson.py" "$@"\n' > "$NEM_OUTPUT/bin/meson"
        chmod 0755 "$NEM_OUTPUT/bin/meson"

test:
  - run: meson --version | grep -q "$NEM_VERSION"
  - run: command -v python3 >/dev/null
