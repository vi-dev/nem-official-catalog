schema: 2
name: cargo-deny
description: Cargo plugin for linting dependencies, licenses, and advisories
homepage: https://github.com/EmbarkStudios/cargo-deny
license: Apache-2.0

versionDiscovery:
  github:
    repo: EmbarkStudios/cargo-deny
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/EmbarkStudios/cargo-deny/releases/download/{{.Version}}/cargo-deny-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "cargo-deny", dst: "bin/cargo-deny", mode: 0o755}

bins: ["bin"]

versions:
