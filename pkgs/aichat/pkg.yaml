schema: 2
name: aichat
description: Terminal LLM client with shell assistant and RAG
homepage: https://github.com/sigoden/aichat
license: MIT OR Apache-2.0

versionDiscovery:
  github:
    repo: sigoden/aichat
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sigoden/aichat/releases/download/v{{.Version}}/aichat-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "aichat", dst: "bin/aichat", mode: 0o755}

bins: ["bin"]

versions:
