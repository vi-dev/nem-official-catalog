schema: 2
name: step-ca
description: Private certificate authority and ACME server
homepage: https://smallstep.com/docs/step-ca
license: Apache-2.0

versionDiscovery:
  github:
    repo: smallstep/certificates
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/smallstep/certificates/releases/download/v{{.Version}}/step-ca_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "step-ca", dst: "bin/step-ca", mode: 0o755}

bins: ["bin"]

versions:
