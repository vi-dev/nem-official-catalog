schema: 2
name: ghz
description: gRPC benchmarking and load testing tool
homepage: https://ghz.sh
license: Apache-2.0

versionDiscovery:
  github:
    repo: bojand/ghz
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/bojand/ghz/releases/download/v{{.Version}}/ghz-{{.OS}}-{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "ghz", dst: "bin/ghz", mode: 0o755}

bins: ["bin"]

