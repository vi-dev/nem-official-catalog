schema: 2
name: crush
description: Terminal AI coding agent with multi-model support
homepage: https://github.com/charmbracelet/crush
license: FSL-1.1-MIT

versionDiscovery:
  github:
    repo: charmbracelet/crush
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/charmbracelet/crush/releases/download/v{{.Version}}/crush_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "crush", dst: "bin/crush", mode: 0o755}

bins: ["bin"]

versions:
