schema: 2
name: ouch
description: Compress and decompress archives from the command line
homepage: https://github.com/ouch-org/ouch
license: MIT

versionDiscovery:
  github:
    repo: ouch-org/ouch
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "ouch", dst: "bin/ouch", mode: 0o755}

bins: ["bin"]

