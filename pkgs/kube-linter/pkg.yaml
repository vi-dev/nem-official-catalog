schema: 2
name: kube-linter
description: Static analysis for Kubernetes YAML and Helm charts
homepage: https://github.com/stackrox/kube-linter
license: Apache-2.0

versionDiscovery:
  github:
    repo: stackrox/kube-linter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/stackrox/kube-linter/releases/download/v{{.Version}}/kube-linter-{{.OS}}{{if eq .Arch \"arm64\"}}_arm64{{end}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kube-linter", dst: "bin/kube-linter", mode: 0o755}

bins: ["bin"]

