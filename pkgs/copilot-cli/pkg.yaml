schema: 2
name: copilot-cli
description: GitHub Copilot coding agent for the terminal
homepage: https://github.com/github/copilot-cli
license: LicenseRef-GitHub-Copilot-CLI

versionDiscovery:
  github:
    repo: github/copilot-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/github/copilot-cli/releases/download/v{{.Version}}/copilot-{{.OS}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "copilot", dst: "bin/copilot", mode: 0o755}

bins: ["bin"]

