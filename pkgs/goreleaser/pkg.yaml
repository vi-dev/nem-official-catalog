schema: 2
name: goreleaser
description: Release automation for Go projects
homepage: https://goreleaser.com
license: MIT

deps:
  - go

versionDiscovery:
  github:
    repo: goreleaser/goreleaser
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/goreleaser/goreleaser/releases/download/v{{.Version}}/goreleaser_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "goreleaser", dst: "bin/goreleaser", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2.17.1
    sha256:
      darwin/arm64: "b65624885c25da9a677b7ad11cf86a02123cc5a56af66f6b4ebb574658eada2e"
      darwin/amd64: "a92a68c61a6833ff67748f532cbebc7b8e49ba30de062ab463b221211ee6368f"
      linux/arm64: "702f03769ac8bcb0e47839c82243cc614ae995633599a98c63062e13ea85f829"
      linux/amd64: "a99bbc7ae0d8d897b07c4c497a9b62f222558804715ef219d1af05a7e417bc80"
