schema: 2
name: walk
description: Terminal file manager with fuzzy search
homepage: https://github.com/antonmedv/walk
license: MIT

versionDiscovery:
  github:
    repo: antonmedv/walk
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/antonmedv/walk/releases/download/v{{.Version}}/walk_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/walk", mode: 0o755}

bins: ["bin"]

