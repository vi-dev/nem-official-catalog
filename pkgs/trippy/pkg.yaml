schema: 2
name: trippy
description: Network diagnostic tool combining traceroute and ping
homepage: https://trippy.rs
license: Apache-2.0

versionDiscovery:
  github:
    repo: fujiapple852/trippy
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "trip", dst: "bin/trip", mode: 0o755}

bins: ["bin"]

versions:
