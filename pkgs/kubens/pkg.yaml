schema: 2
name: kubens
description: Fast kubectl namespace switcher
homepage: https://github.com/ahmetb/kubectx
license: Apache-2.0

versionDiscovery:
  github:
    repo: ahmetb/kubectx
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ahmetb/kubectx/releases/download/v{{.Version}}/kubens_v{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubens", dst: "bin/kubens", mode: 0o755}

bins: ["bin"]

