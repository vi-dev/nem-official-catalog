schema: 2
name: terraform-docs
description: Generate documentation from Terraform modules
homepage: https://terraform-docs.io
license: MIT

versionDiscovery:
  github:
    repo: terraform-docs/terraform-docs
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/terraform-docs/terraform-docs/releases/download/v{{.Version}}/terraform-docs-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "terraform-docs", dst: "bin/terraform-docs", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.24.0
    sha256:
      darwin/arm64: "f6b114f4b032f3f9202ab6c23bfd28c3c8e68aeeb8a8f12fc118bf2073081d71"
