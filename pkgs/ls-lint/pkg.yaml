schema: 2
name: ls-lint
description: Directory and filename linter
homepage: https://ls-lint.org
license: MIT

versionDiscovery:
  github:
    repo: loeffel-io/ls-lint
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

# The .tar.gz assets are not valid gzip; the bare binaries are the usable ones.
artifact:
  url: "https://github.com/loeffel-io/ls-lint/releases/download/v{{.Version}}/ls-lint-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/ls-lint", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2.3.1
    sha256:
      darwin/arm64: "e4ed2ce2b7b61d6685769e34c6375ccecb14a3f00ee59438cf82d01d6236a3c4"
      darwin/amd64: "fc17fc642e95fd8bf7030ed661e86758bee654f6e11f1e31a5f21887f47f73ae"
      linux/arm64: "2abdb71243c619f0bb29587be5c228bec84c107985f2c066139ef0ec35fd3a99"
      linux/amd64: "b5a0d2e4427ad039fbc574551f17679f38f142b25d15e0e538769f8cf15af397"
