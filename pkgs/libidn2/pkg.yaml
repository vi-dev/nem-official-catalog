schema: 2

name: libidn2
description: GNU IDNA2008/TR46 internationalized domain name library and idn2 CLI
homepage: https://www.gnu.org/software/libidn/#libidn2
license: GPL-2.0-or-later OR LGPL-3.0-or-later

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# All 2.x versions share the libidn2.0 soname; link dependents pin compat "2".
deps:
  - name: libunistring
    kind: link
    compat: "1"

bins: [bin]
libs: [lib]

versionDiscovery:
  http:
    url: https://ftp.gnu.org/gnu/libidn/
    filter: 'libidn2-(\d+\.\d+\.\d+)\.tar\.gz'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 2.3.8
    sourceSha256: "f557911bf6171621e1f72ff35f5b1825bb35b52ed45325dcdee931e5d3c0787a"

build:
  deps:
    - name: libunistring
      kind: link
      compat: "1"
  source:
    url: 'https://ftp.gnu.org/gnu/libidn/libidn2-{{.Version}}.tar.gz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        # Without --disable-rpath gnulib bakes the staged libunistring path
        # into DT_RUNPATH.
        ./configure --prefix=/ --libdir=/lib --disable-static --disable-dependency-tracking --disable-doc --disable-nls --disable-rpath
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
        rm -f "$NEM_OUTPUT/lib/"*.la
