schema: 2
name: task
description: Task runner and simpler Make alternative
homepage: https://taskfile.dev
license: MIT

versionDiscovery:
  github:
    repo: go-task/task
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/go-task/task/releases/download/v{{.Version}}/task_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "task", dst: "bin/task", mode: 0o755}

bins: ["bin"]

