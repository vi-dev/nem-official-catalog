schema: 2
name: polaris
description: Best-practices validation for Kubernetes configuration
homepage: https://polaris.docs.fairwinds.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: FairwindsOps/polaris
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/FairwindsOps/polaris/releases/download/v{{.Version}}/polaris_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "polaris", dst: "bin/polaris", mode: 0o755}

bins: ["bin"]

