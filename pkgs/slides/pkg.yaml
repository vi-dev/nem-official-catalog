schema: 2
name: slides
description: Terminal based presentation tool
homepage: https://github.com/maaslalani/slides
license: MIT

versionDiscovery:
  github:
    repo: maaslalani/slides
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/maaslalani/slides/releases/download/v{{.Version}}/slides_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "slides", dst: "bin/slides", mode: 0o755}

bins: ["bin"]

