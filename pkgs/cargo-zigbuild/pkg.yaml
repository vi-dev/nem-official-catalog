schema: 2
name: cargo-zigbuild
description: Compiles Cargo projects using zig as the linker
homepage: https://github.com/rust-cross/cargo-zigbuild
license: MIT

versionDiscovery:
  github:
    repo: rust-cross/cargo-zigbuild
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/rust-cross/cargo-zigbuild/releases/download/v{{.Version}}/cargo-zigbuild-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "cargo-zigbuild", dst: "bin/cargo-zigbuild", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.23.0
    sha256:
      darwin/arm64: "3d8f1ad296d3f3e97122607f7c972393c6329801027acb71bb7d17a4e30ef092"
      darwin/amd64: "f8c746d12dfae79ac0704c5aa13631a05b24c3e4ee7216eb40f70943bd8ca7b1"
      linux/arm64: "5917d5416884cba0f23c2653016f7f2df2ec04e74eb6b259598fecc066f8c429"
      linux/amd64: "c636e4f72b6f40a40ddf0414c8c6056f78b87eea3be0edf01f08d65fa028a373"
