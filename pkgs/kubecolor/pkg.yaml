schema: 2
name: kubecolor
description: Colorize kubectl output
homepage: https://kubecolor.github.io
license: MIT

versionDiscovery:
  github:
    repo: kubecolor/kubecolor
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubecolor/kubecolor/releases/download/v{{.Version}}/kubecolor_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubecolor", dst: "bin/kubecolor", mode: 0o755}

