schema: 2
name: kubespy
description: Observe Kubernetes resources in real time
homepage: https://github.com/pulumi/kubespy
license: Apache-2.0

versionDiscovery:
  github:
    repo: pulumi/kubespy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pulumi/kubespy/releases/download/v{{.Version}}/kubespy-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubespy", dst: "bin/kubespy", mode: 0o755}

bins: ["bin"]

