schema: 2
name: skim
description: Fuzzy finder for the terminal
homepage: https://github.com/skim-rs/skim
license: MIT

versionDiscovery:
  github:
    repo: skim-rs/skim
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/skim-rs/skim/releases/download/v{{.Version}}/skim-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "sk", dst: "bin/sk", mode: 0o755}

bins: ["bin"]

versions:
