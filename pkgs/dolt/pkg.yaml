schema: 2
name: dolt
description: SQL database with Git-style version control
homepage: https://github.com/dolthub/dolt
license: Apache-2.0

versionDiscovery:
  github:
    repo: dolthub/dolt
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/dolthub/dolt/releases/download/v{{.Version}}/dolt-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}

bins: ["bin"]

