schema: 2
name: neovim
description: Vim-fork focused on extensibility and usability
homepage: https://neovim.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: neovim/neovim
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/neovim/neovim/releases/download/v{{.Version}}/nvim-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}

bins: ["bin"]

