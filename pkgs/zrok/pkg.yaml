schema: 2
name: zrok
description: Peer-to-peer sharing platform built on OpenZiti
homepage: https://zrok.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: openziti/zrok
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/openziti/zrok/releases/download/v{{.Version}}/zrok_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  # v2 archives ship the binary as zrok2 so it can sit beside a v1 install.
  - copy: {src: "zrok2", dst: "bin/zrok", mode: 0o755}

bins: ["bin"]

versions:
