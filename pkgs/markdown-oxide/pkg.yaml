schema: 2
name: markdown-oxide
description: Markdown language server for personal knowledge management
homepage: https://oxide.md
license: Apache-2.0

versionDiscovery:
  github:
    repo: Feel-ix-343/markdown-oxide
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Feel-ix-343/markdown-oxide/releases/download/v{{.Version}}/markdown-oxide-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "markdown-oxide", dst: "bin/markdown-oxide", mode: 0o755}

bins: ["bin"]

