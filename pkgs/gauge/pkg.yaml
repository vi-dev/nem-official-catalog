schema: 2
name: gauge
description: Cross-platform test automation runner
homepage: https://gauge.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: getgauge/gauge
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/getgauge/gauge/releases/download/v{{.Version}}/gauge-{{.Version}}-{{.OS}}.{{replace .Arch \"amd64\" \"x86_64\"}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "gauge", dst: "bin/gauge", mode: 0o755}

bins: ["bin"]

