schema: 2
name: aws-iam-authenticator
description: Authenticate to Kubernetes clusters with AWS IAM credentials
homepage: https://github.com/kubernetes-sigs/aws-iam-authenticator
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubernetes-sigs/aws-iam-authenticator
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v{{.Version}}/aws-iam-authenticator_{{.Version}}_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/aws-iam-authenticator", mode: 0o755}

bins: ["bin"]

