schema: 2
name: tuios
description: Terminal multiplexer with a windowed interface
homepage: https://tuios.gaurav.zip
license: MIT

versionDiscovery:
  github:
    repo: Gaurav-Gosain/tuios
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Gaurav-Gosain/tuios/releases/download/v{{.Version}}/tuios_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tuios", dst: "bin/tuios", mode: 0o755}

bins: ["bin"]

versions:
