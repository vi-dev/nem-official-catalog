schema: 2
name: slsa-verifier
description: Verify SLSA provenance of artifacts
homepage: https://github.com/slsa-framework/slsa-verifier
license: Apache-2.0

versionDiscovery:
  github:
    repo: slsa-framework/slsa-verifier
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/slsa-framework/slsa-verifier/releases/download/v{{.Version}}/slsa-verifier-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/slsa-verifier", mode: 0o755}

bins: ["bin"]

versions:
