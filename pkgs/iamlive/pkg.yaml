schema: 2
name: iamlive
description: Generate AWS IAM policies from observed API calls
homepage: https://github.com/iann0036/iamlive
license: MIT

versionDiscovery:
  github:
    repo: iann0036/iamlive
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/iann0036/iamlive/releases/download/v{{.Version}}/iamlive_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "iamlive", dst: "bin/iamlive", mode: 0o755}

bins: ["bin"]

