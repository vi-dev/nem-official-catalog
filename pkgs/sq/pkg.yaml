schema: 2
name: sq
description: Query and wrangle SQL databases and document formats
homepage: https://sq.io
license: MIT

versionDiscovery:
  github:
    repo: neilotoole/sq
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/neilotoole/sq/releases/download/v{{.Version}}/sq-{{.Version}}-{{replace .OS \"darwin\" \"macos\"}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "sq", dst: "bin/sq", mode: 0o755}

bins: ["bin"]

