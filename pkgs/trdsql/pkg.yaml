schema: 2
name: trdsql
description: Run SQL queries against CSV, LTSV, JSON, and TBLN files
homepage: https://noborus.github.io/trdsql/
license: MIT

versionDiscovery:
  github:
    repo: noborus/trdsql
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/noborus/trdsql/releases/download/v{{.Version}}/trdsql_v{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 1}
  - copy: {src: "trdsql", dst: "bin/trdsql", mode: 0o755}

bins: ["bin"]

