schema: 2
name: sloth
description: Prometheus SLO and alerting rule generator
homepage: https://sloth.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: slok/sloth
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/slok/sloth/releases/download/v{{.Version}}/sloth-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/sloth", mode: 0o755}

bins: ["bin"]

