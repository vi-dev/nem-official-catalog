schema: 2
name: fastfetch
description: System information tool in the style of neofetch
homepage: https://github.com/fastfetch-cli/fastfetch
license: MIT

versionDiscovery:
  github:
    repo: fastfetch-cli/fastfetch
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/fastfetch-cli/fastfetch/releases/download/{{.Version}}/fastfetch-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"arm64\" \"aarch64\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "usr/bin/fastfetch", dst: "bin/fastfetch", mode: 0o755}

bins: ["bin"]

