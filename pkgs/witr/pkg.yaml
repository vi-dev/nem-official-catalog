schema: 2
name: witr
description: Trace a process, port, container, or file to its origin
homepage: https://pranshuparmar.github.io/witr/
license: Apache-2.0

versionDiscovery:
  github:
    repo: pranshuparmar/witr
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pranshuparmar/witr/releases/download/v{{.Version}}/witr-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/witr", mode: 0o755}

bins: ["bin"]

versions:
