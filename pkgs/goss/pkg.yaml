schema: 2
name: goss
description: YAML-based server validation and testing tool
homepage: https://github.com/goss-org/goss
license: Apache-2.0

versionDiscovery:
  github:
    repo: goss-org/goss
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/goss-org/goss/releases/download/v{{.Version}}/goss_{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "goss", dst: "bin/goss", mode: 0o755}

bins: ["bin"]

