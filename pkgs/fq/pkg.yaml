schema: 2
name: fq
description: Query and decode binary formats with a jq-like language
homepage: https://github.com/wader/fq
license: MIT

versionDiscovery:
  github:
    repo: wader/fq
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/wader/fq/releases/download/v{{.Version}}/fq_{{.Version}}_{{replace .OS \"darwin\" \"macos\"}}_{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 0}
  - copy: {src: "fq", dst: "bin/fq", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.17.0
    sha256:
      darwin/arm64: "b3007aa0d2ade57eeb21b7cec14ef71ac8adc5ce34221045aece68efd539ff34"
      darwin/amd64: "55221b37ad199005777f2e2b00528f2eb6f5cdb74e174a4230d24c6796d61ad8"
      linux/arm64: "217eba0d2cd03c8cbf9c54e45ecb9700b7100d592b71410ee3628c6d423cd328"
      linux/amd64: "41c277c59dffacfba9c9f9f4ad3a75bef591d341e40b9ac89fc85acbdf645fee"
