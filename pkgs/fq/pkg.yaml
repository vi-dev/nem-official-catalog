schema: 2
name: fq
description: Query and decode binary formats with a jq-like language
homepage: https://github.com/wader/fq
license: MIT

versionDiscovery:
  github:
    repo: wader/fq
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/wader/fq/releases/download/v{{.Version}}/fq_{{.Version}}_{{replace .OS \"darwin\" \"macos\"}}_{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 0}
  - copy: {src: "fq", dst: "bin/fq", mode: 0o755}

bins: ["bin"]

