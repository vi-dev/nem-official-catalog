schema: 2
name: logdy
description: Realtime log viewer with a web UI
homepage: https://logdy.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: logdyhq/logdy-core
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/logdyhq/logdy-core/releases/download/v{{.Version}}/logdy_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/logdy", mode: 0o755}

bins: ["bin"]

