schema: 2
name: wasmtime
description: Standalone runtime for WebAssembly and WASI
homepage: https://wasmtime.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: bytecodealliance/wasmtime
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/bytecodealliance/wasmtime/releases/download/v{{.Version}}/wasmtime-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace .OS \"darwin\" \"macos\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "wasmtime", dst: "bin/wasmtime", mode: 0o755}

bins: ["bin"]

