schema: 2
name: proxify
description: Proxy for capturing, manipulating, and replaying HTTP traffic
homepage: https://github.com/projectdiscovery/proxify
license: MIT

versionDiscovery:
  github:
    repo: projectdiscovery/proxify
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/projectdiscovery/proxify/releases/download/v{{.Version}}/proxify_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "proxify", dst: "bin/proxify", mode: 0o755}

bins: ["bin"]

versions:
