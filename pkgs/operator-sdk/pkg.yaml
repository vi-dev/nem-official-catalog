schema: 2
name: operator-sdk
description: SDK for building Kubernetes operators
homepage: https://sdk.operatorframework.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: operator-framework/operator-sdk
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/operator-framework/operator-sdk/releases/download/v{{.Version}}/operator-sdk_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/operator-sdk", mode: 0o755}

bins: ["bin"]

