schema: 2
name: pkl
description: Configuration language with rich validation and tooling
homepage: https://pkl-lang.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: apple/pkl
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/apple/pkl/releases/download/{{.Version}}/pkl-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"arm64\" \"aarch64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/pkl", mode: 0o755}

bins: ["bin"]

