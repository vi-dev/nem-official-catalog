schema: 2

name: jemalloc
description: General-purpose scalable concurrent malloc implementation
homepage: https://jemalloc.net
license: BSD-2-Clause

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# compat "5" floats within 5.x; all versions share the libjemalloc.2 soname.
bins: [bin]
libs: [lib]

versionDiscovery:
  github:
    repo: jemalloc/jemalloc
    filter: '^\d+\.\d+\.\d+$'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 5.3.1
    sourceSha256: "3826bc80232f22ed5c4662f3034f799ca316e819103bdc7bb99018a421706f92"

build:
  source:
    url: 'https://github.com/jemalloc/jemalloc/releases/download/{{.Version}}/jemalloc-{{.Version}}.tar.bz2'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        # darwin defaults to a je_ prefix; force the empty prefix everywhere
        # so the API is uniform and linking replaces malloc.
        ./configure --prefix=/ --libdir=/lib --with-jemalloc-prefix=""
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
