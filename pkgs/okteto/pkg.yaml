schema: 2
name: okteto
description: Develop applications directly in a Kubernetes cluster
homepage: https://okteto.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: okteto/okteto
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/okteto/okteto/releases/download/{{.Version}}/okteto-{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}-{{replace .Arch \"amd64\" \"x86_64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/okteto", mode: 0o755}

bins: ["bin"]

