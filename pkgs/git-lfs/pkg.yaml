schema: 2
name: git-lfs
description: Git extension for versioning large files
homepage: https://git-lfs.com
license: MIT

versionDiscovery:
  github:
    repo: git-lfs/git-lfs
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/git-lfs/git-lfs/releases/download/v{{.Version}}/git-lfs-{{.OS}}-{{.Arch}}-v{{.Version}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  # both zip and tar.gz wrap contents in git-lfs-<version>/
  - extract: {strip: 1}
  - copy: {src: "git-lfs", dst: "bin/git-lfs", mode: 0o755}

bins: ["bin"]

