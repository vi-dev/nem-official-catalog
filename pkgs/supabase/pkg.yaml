schema: 2
name: supabase
description: CLI for developing and deploying Supabase projects
homepage: https://github.com/supabase/cli
license: MIT

versionDiscovery:
  github:
    repo: supabase/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/supabase/cli/releases/download/v{{.Version}}/supabase_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

# The supabase launcher execs the supabase-go helper from its own directory,
# so both binaries stay side by side at the package root.
install:
  - extract: {strip: 0}

bins: ["."]

