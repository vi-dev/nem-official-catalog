schema: 2
name: miniserve
description: Serve files and directories over HTTP from the command line
homepage: https://github.com/svenstaro/miniserve
license: MIT

versionDiscovery:
  github:
    repo: svenstaro/miniserve
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/svenstaro/miniserve/releases/download/v{{.Version}}/miniserve-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/miniserve", mode: 0o755}

bins: ["bin"]

versions:
