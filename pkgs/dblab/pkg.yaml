schema: 2
name: dblab
description: Terminal UI database client for Postgres, MySQL, SQLite, and more
homepage: https://github.com/danvergara/dblab
license: MIT

versionDiscovery:
  github:
    repo: danvergara/dblab
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/danvergara/dblab/releases/download/v{{.Version}}/dblab_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "dblab", dst: "bin/dblab", mode: 0o755}

bins: ["bin"]

