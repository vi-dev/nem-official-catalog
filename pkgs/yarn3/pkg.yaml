schema: 2
name: yarn3
description: Yarn Berry (3.x) package manager for Node.js
homepage: https://yarnpkg.com
license: BSD-2-Clause

versionDiscovery:
  github:
    repo: yarnpkg/berry
    filter: '^@yarnpkg/cli/3\.\d+\.\d+$'
    prefix: "@yarnpkg/cli/"

deps:
  - node

# repo.yarnpkg.com is the official Berry distribution endpoint (the same
# URL corepack installs from); the artifact is a single Node script.
artifact:
  url: "https://repo.yarnpkg.com/{{.Version}}/packages/yarnpkg-cli/bin/yarn.js"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/yarn", mode: 0o755}
  - copy: {src: "{{.Artifact}}", dst: "bin/yarnpkg", mode: 0o755}

bins: ["bin"]

versions:
