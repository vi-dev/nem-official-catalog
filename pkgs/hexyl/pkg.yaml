schema: 2
name: hexyl
description: Command-line hex viewer
homepage: https://github.com/sharkdp/hexyl
license: MIT OR Apache-2.0

versionDiscovery:
  github:
    repo: sharkdp/hexyl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sharkdp/hexyl/releases/download/v{{.Version}}/hexyl-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "hexyl", dst: "bin/hexyl", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.17.0
    sha256:
