schema: 2
name: stripe
description: Command-line tool for the Stripe API
homepage: https://github.com/stripe/stripe-cli
license: Apache-2.0

versionDiscovery:
  github:
    repo: stripe/stripe-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/stripe/stripe-cli/releases/download/v{{.Version}}/stripe_{{.Version}}_{{replace .OS \"darwin\" \"mac-os\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "stripe", dst: "bin/stripe", mode: 0o755}

bins: ["bin"]

