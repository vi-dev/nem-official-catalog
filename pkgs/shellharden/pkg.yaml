schema: 2
name: shellharden
description: Corrective syntax highlighter and rewriter for bash
homepage: https://github.com/anordal/shellharden
license: MPL-2.0

versionDiscovery:
  github:
    repo: anordal/shellharden
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/anordal/shellharden/releases/download/v{{.Version}}/shellharden-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "shellharden", dst: "bin/shellharden", mode: 0o755}

bins: ["bin"]

versions:
