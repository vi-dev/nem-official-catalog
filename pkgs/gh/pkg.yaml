schema: 2
name: gh
description: GitHub command-line tool
homepage: https://cli.github.com
license: MIT

versionDiscovery:
  github:
    repo: cli/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cli/cli/releases/download/v{{.Version}}/gh_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 1}

bins: ["bin"]

