schema: 2
name: gleam
description: Type-safe language for the Erlang and JavaScript runtimes
homepage: https://gleam.run
license: Apache-2.0

versionDiscovery:
  github:
    repo: gleam-lang/gleam
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/gleam-lang/gleam/releases/download/v{{.Version}}/gleam-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gleam", dst: "bin/gleam", mode: 0o755}

bins: ["bin"]

versions:
