schema: 2
name: zig
description: Zig programming language toolchain
homepage: https://ziglang.org
license: MIT

versionDiscovery:
  github:
    repo: ziglang/zig
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://ziglang.org/download/{{.Version}}/zig-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace .OS \"darwin\" \"macos\"}}-{{.Version}}.tar.xz"

# The zig binary resolves its bundled lib/ directory relative to itself,
# so the archive layout stays intact and the install root goes on PATH.
install:
  - extract: {strip: 1}

bins: ["."]

