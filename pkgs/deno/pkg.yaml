schema: 2
name: deno
description: Secure JavaScript and TypeScript runtime
homepage: https://deno.com
license: MIT

versionDiscovery:
  github:
    repo: denoland/deno
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/denoland/deno/releases/download/v{{.Version}}/deno-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.zip"

# The zip holds the bare deno binary at its root.
install:
  - extract: {strip: 0}

bins: ["."]

