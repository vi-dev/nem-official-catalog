schema: 2
name: minify
description: Minifier for HTML, CSS, JS, JSON, SVG, and XML
homepage: https://github.com/tdewolff/minify
license: MIT

versionDiscovery:
  github:
    repo: tdewolff/minify
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/tdewolff/minify/releases/download/v{{.Version}}/minify_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "minify", dst: "bin/minify", mode: 0o755}

bins: ["bin"]

