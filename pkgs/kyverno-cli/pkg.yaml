schema: 2
name: kyverno-cli
description: Apply and test Kyverno policies outside a cluster
homepage: https://kyverno.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kyverno/kyverno
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kyverno/kyverno/releases/download/v{{.Version}}/kyverno-cli_v{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kyverno", dst: "bin/kyverno", mode: 0o755}

bins: ["bin"]

