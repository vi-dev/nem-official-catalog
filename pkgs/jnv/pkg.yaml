schema: 2
name: jnv
description: Interactive JSON filter using jq
homepage: https://github.com/ynqa/jnv
license: MIT

versionDiscovery:
  github:
    repo: ynqa/jnv
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ynqa/jnv/releases/download/v{{.Version}}/jnv-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "jnv", dst: "bin/jnv", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.7.1
    sha256:
      darwin/arm64: "a66dc820dee8d035108e493efcfba1c92ad313d2b148b359349612c8b966fb41"
      darwin/amd64: "3bb29e5267a8925da4c19b3b3f31a8c35b19c2703bf292d71ea5e51f2defc3d6"
      linux/arm64: "88b1a1f5cbc703d2f45fec6b8b4a8f9c35e9969c84565c00d27cc84baa0c0da8"
      linux/amd64: "4c3e7368339a2ecbdb4d2bfe2c3ec5f6fc36810bed95425fe05a65200fae8d15"
