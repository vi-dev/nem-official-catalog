schema: 2
name: goreman
description: Foreman clone that runs Procfile-based process groups
homepage: https://github.com/mattn/goreman
license: MIT

versionDiscovery:
  github:
    repo: mattn/goreman
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/mattn/goreman/releases/download/v{{.Version}}/goreman_v{{.Version}}_{{.OS}}_{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 1}
  - copy: {src: "goreman", dst: "bin/goreman", mode: 0o755}

bins: ["bin"]

versions:
