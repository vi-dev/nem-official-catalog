schema: 2
name: mailpit
description: SMTP testing server with a web UI and API
homepage: https://mailpit.axllent.org
license: MIT

versionDiscovery:
  github:
    repo: axllent/mailpit
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/axllent/mailpit/releases/download/v{{.Version}}/mailpit-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "mailpit", dst: "bin/mailpit", mode: 0o755}

bins: ["bin"]

