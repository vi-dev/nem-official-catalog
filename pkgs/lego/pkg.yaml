schema: 2
name: lego
description: ACME client and library for Let's Encrypt certificates
homepage: https://go-acme.github.io/lego/
license: MIT

versionDiscovery:
  github:
    repo: go-acme/lego
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/go-acme/lego/releases/download/v{{.Version}}/lego_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "lego", dst: "bin/lego", mode: 0o755}

bins: ["bin"]

