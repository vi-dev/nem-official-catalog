schema: 2
name: kubectl-foreach
description: Run kubectl against multiple contexts at once
homepage: https://github.com/ahmetb/kubectl-foreach
license: Apache-2.0

versionDiscovery:
  github:
    repo: ahmetb/kubectl-foreach
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ahmetb/kubectl-foreach/releases/download/v{{.Version}}/kubectl-foreach_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-foreach", dst: "bin/kubectl-foreach", mode: 0o755}

bins: ["bin"]

