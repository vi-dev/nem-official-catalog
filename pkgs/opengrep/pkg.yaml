schema: 2
name: opengrep
description: Static code analysis engine for finding security issues
homepage: https://github.com/opengrep/opengrep
license: LGPL-2.1

versionDiscovery:
  github:
    repo: opengrep/opengrep
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/opengrep/opengrep/releases/download/v{{.Version}}/opengrep_{{if eq .OS \"darwin\"}}osx_{{replace .Arch \"amd64\" \"x86\"}}{{else}}manylinux_{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86\"}}{{end}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/opengrep", mode: 0o755}

bins: ["bin"]

