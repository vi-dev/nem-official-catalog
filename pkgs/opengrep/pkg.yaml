schema: 2
name: opengrep
description: Static code analysis engine for finding security issues
homepage: https://github.com/opengrep/opengrep
license: LGPL-2.1

versionDiscovery:
  github:
    repo: opengrep/opengrep
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/opengrep/opengrep/releases/download/v{{.Version}}/opengrep_{{if eq .OS \"darwin\"}}osx_{{replace .Arch \"amd64\" \"x86\"}}{{else}}manylinux_{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86\"}}{{end}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/opengrep", mode: 0o755}

bins: ["bin"]

versions:
  - version: 1.27.1
    sha256:
      darwin/arm64: "e0cf2287c00f9e559b5ad28f5731924fc5ec7778f35363d2e15f94e15880a6de"
      darwin/amd64: "0e96abde66eda9dcfe8b81b2c616d71deadae0ec62fe026b9e199498ce1aac10"
      linux/arm64: "96ee2caddd5f17821ae6952774a91c8781778bfa9af1ace83645444c0edc6c97"
      linux/amd64: "58053da76672bbeb5b0a5441021c58338707052e10f81d777140ca879bd491ce"
