schema: 2
name: chezmoi
description: Manage your dotfiles across multiple machines
homepage: https://chezmoi.io
license: MIT

versionDiscovery:
  github:
    repo: twpayne/chezmoi
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/twpayne/chezmoi/releases/download/v{{.Version}}/chezmoi_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "chezmoi", dst: "bin/chezmoi", mode: 0o755}

bins: ["bin"]

