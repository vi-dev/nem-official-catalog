schema: 2
name: kubectl-gadget
description: kubectl plugin for the Inspektor Gadget eBPF debugging tools
homepage: https://inspektor-gadget.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: inspektor-gadget/inspektor-gadget
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/inspektor-gadget/inspektor-gadget/releases/download/v{{.Version}}/kubectl-gadget-{{.OS}}-{{.Arch}}-v{{.Version}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-gadget", dst: "bin/kubectl-gadget", mode: 0o755}

bins: ["bin"]

