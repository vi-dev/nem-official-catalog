schema: 2
name: bottom
description: Graphical system monitor (btm)
homepage: https://github.com/ClementTsang/bottom
license: MIT

versionDiscovery:
  github:
    repo: ClementTsang/bottom
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "btm", dst: "bin/btm", mode: 0o755}

bins: ["bin"]

