schema: 2
name: k0s
description: Kubernetes distribution shipped as a single binary
homepage: https://k0sproject.io
license: Apache-2.0

platforms: [linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: k0sproject/k0s
    filter: '^v\d+\.\d+\.\d+\+k0s\.\d+$'
    prefix: "v"

# Upstream tags are "v1.36.3+k0s.2", but a version doubles as an OCI tag in
# the catalog's archives repo, where "+" is invalid — it is spelled "_" here
# and mapped back in the URL.
artifact:
  url: "https://github.com/k0sproject/k0s/releases/download/v{{replace .Version \"_\" \"+\"}}/k0s-v{{replace .Version \"_\" \"+\"}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/k0s", mode: 0o755}

bins: ["bin"]

versions:
  - version: 1.36.3_k0s.2
    sha256:
      linux/arm64: "5114193cad12fd34169518bb81b5967792e0c3b840dd6d730d0e0252315131ee"
      linux/amd64: "f8b278ba5a9938ced226381484a0f31b6bfa2938703949df235474e03c774acc"
