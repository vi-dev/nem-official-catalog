schema: 2
name: devpod
description: Client-only tool for devcontainer-based development environments
homepage: https://devpod.sh
license: MPL-2.0

versionDiscovery:
  github:
    repo: loft-sh/devpod
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/loft-sh/devpod/releases/download/v{{.Version}}/devpod-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/devpod", mode: 0o755}

bins: ["bin"]

