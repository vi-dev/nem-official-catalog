schema: 2
name: osv-scanner
description: Vulnerability scanner using the OSV database
homepage: https://google.github.io/osv-scanner/
license: Apache-2.0

versionDiscovery:
  github:
    repo: google/osv-scanner
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/google/osv-scanner/releases/download/v{{.Version}}/osv-scanner_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/osv-scanner", mode: 0o755}

bins: ["bin"]

