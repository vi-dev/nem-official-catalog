schema: 2
name: kubectl-argo-rollouts
description: Kubectl plugin and CLI for Argo Rollouts
homepage: https://argoproj.github.io/rollouts/
license: Apache-2.0

versionDiscovery:
  github:
    repo: argoproj/argo-rollouts
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/argoproj/argo-rollouts/releases/download/v{{.Version}}/kubectl-argo-rollouts-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kubectl-argo-rollouts", mode: 0o755}

bins: ["bin"]

