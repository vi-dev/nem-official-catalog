schema: 2
name: sqlc
description: Generate type-safe code from SQL
homepage: https://sqlc.dev
license: MIT

versionDiscovery:
  github:
    repo: sqlc-dev/sqlc
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sqlc-dev/sqlc/releases/download/v{{.Version}}/sqlc_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "sqlc", dst: "bin/sqlc", mode: 0o755}

bins: ["bin"]

