schema: 2
name: dockerize
description: Utility to simplify running applications in Docker containers
homepage: https://github.com/jwilder/dockerize
license: MIT

versionDiscovery:
  github:
    repo: jwilder/dockerize
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/jwilder/dockerize/releases/download/v{{.Version}}/dockerize-{{.OS}}-{{.Arch}}-v{{.Version}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "dockerize", dst: "bin/dockerize", mode: 0o755}

bins: ["bin"]

