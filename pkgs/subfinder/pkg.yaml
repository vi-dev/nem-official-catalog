schema: 2
name: subfinder
description: Passive subdomain discovery tool
homepage: https://github.com/projectdiscovery/subfinder
license: MIT

versionDiscovery:
  github:
    repo: projectdiscovery/subfinder
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/projectdiscovery/subfinder/releases/download/v{{.Version}}/subfinder_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "subfinder", dst: "bin/subfinder", mode: 0o755}

bins: ["bin"]

versions:
