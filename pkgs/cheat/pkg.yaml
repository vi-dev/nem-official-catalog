schema: 2
name: cheat
description: Create and view interactive cheatsheets on the command line
homepage: https://github.com/cheat/cheat
license: MIT

versionDiscovery:
  github:
    repo: cheat/cheat
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/cheat/cheat/releases/download/{{.Version}}/cheat-{{.OS}}-{{.Arch}}.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cheat-{{.OS}}-{{.Arch}}", dst: "bin/cheat", mode: 0o755}

bins: ["bin"]

