schema: 2
name: temporal
description: Temporal workflow platform CLI and dev server
homepage: https://temporal.io
license: MIT

versionDiscovery:
  github:
    repo: temporalio/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/temporalio/cli/releases/download/v{{.Version}}/temporal_cli_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "temporal", dst: "bin/temporal", mode: 0o755}

bins: ["bin"]

