schema: 2

name: libksba
description: X.509 and CMS certificate handling library for GnuPG
homepage: https://gnupg.org/software/libksba/
license: LGPL-3.0-or-later OR GPL-2.0-or-later

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# compat "1" floats within 1.x; all versions share the libksba.8 soname.
deps:
  - name: libgpg-error
    kind: link
    compat: "1"

libs: [lib]

versionDiscovery:
  http:
    url: https://gnupg.org/ftp/gcrypt/libksba/
    filter: 'libksba-(\d+\.\d+\.\d+)\.tar\.bz2'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.8.0
    sourceSha256: "296b9db9095749f2aa104202d7ab7fd09ad10710e00780a709c9754b1a1d9292"

build:
  deps:
    - name: libgpg-error
      kind: link
      compat: "1"
  source:
    url: 'https://gnupg.org/ftp/gcrypt/libksba/libksba-{{.Version}}.tar.bz2'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --libdir=/lib --disable-static --disable-dependency-tracking
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
        rm -f "$NEM_OUTPUT/lib/"*.la
