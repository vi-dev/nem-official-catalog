schema: 2
name: pv-migrate
description: Migrate data between Kubernetes persistent volume claims
homepage: https://github.com/utkuozdemir/pv-migrate
license: Apache-2.0

versionDiscovery:
  github:
    repo: utkuozdemir/pv-migrate
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/utkuozdemir/pv-migrate/releases/download/v{{.Version}}/pv-migrate_v{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "pv-migrate", dst: "bin/pv-migrate", mode: 0o755}

bins: ["bin"]

