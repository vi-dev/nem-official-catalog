schema: 2
name: kube-score
description: Static analysis of Kubernetes object definitions
homepage: https://kube-score.com
license: MIT

versionDiscovery:
  github:
    repo: zegl/kube-score
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/zegl/kube-score/releases/download/v{{.Version}}/kube-score_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kube-score", dst: "bin/kube-score", mode: 0o755}

bins: ["bin"]

