schema: 2
name: go-size-analyzer
description: Analyzes the size composition of compiled Go binaries
homepage: https://github.com/Zxilly/go-size-analyzer
license: AGPL-3.0

versionDiscovery:
  github:
    repo: Zxilly/go-size-analyzer
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Zxilly/go-size-analyzer/releases/download/v{{.Version}}/go-size-analyzer_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gsa", dst: "bin/gsa", mode: 0o755}

bins: ["bin"]

