schema: 2
name: k8sgpt
description: Scans Kubernetes clusters and explains issues in plain language
homepage: https://k8sgpt.ai
license: Apache-2.0

versionDiscovery:
  github:
    repo: k8sgpt-ai/k8sgpt
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/k8sgpt-ai/k8sgpt/releases/download/v{{.Version}}/k8sgpt_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "k8sgpt", dst: "bin/k8sgpt", mode: 0o755}

bins: ["bin"]

