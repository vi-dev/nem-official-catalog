schema: 2
name: cfssl
description: PKI and TLS toolkit with a certificate authority server
homepage: https://github.com/cloudflare/cfssl
license: BSD-2-Clause

versionDiscovery:
  github:
    repo: cloudflare/cfssl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cloudflare/cfssl/releases/download/v{{.Version}}/cfssl_{{.Version}}_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/cfssl", mode: 0o755}

bins: ["bin"]

