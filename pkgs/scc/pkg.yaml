schema: 2
name: scc
description: Fast code counter with complexity and COCOMO estimates
homepage: https://github.com/boyter/scc
license: MIT

versionDiscovery:
  github:
    repo: boyter/scc
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/boyter/scc/releases/download/v{{.Version}}/scc_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "scc", dst: "bin/scc", mode: 0o755}

bins: ["bin"]

