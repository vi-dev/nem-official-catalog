schema: 2
name: kubectl-count
description: Count Kubernetes resources by kind
homepage: https://github.com/chenjiandongx/kubectl-count
license: MIT

versionDiscovery:
  github:
    repo: chenjiandongx/kubectl-count
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/chenjiandongx/kubectl-count/releases/download/v{{.Version}}/kubectl-count_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-count", dst: "bin/kubectl-count", mode: 0o755}

bins: ["bin"]

