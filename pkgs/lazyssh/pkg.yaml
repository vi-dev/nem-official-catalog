schema: 2
name: lazyssh
description: Terminal UI SSH connection manager
homepage: https://github.com/Adembc/lazyssh
license: Apache-2.0

versionDiscovery:
  github:
    repo: Adembc/lazyssh
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Adembc/lazyssh/releases/download/v{{.Version}}/lazyssh_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "lazyssh", dst: "bin/lazyssh", mode: 0o755}

bins: ["bin"]

versions:
