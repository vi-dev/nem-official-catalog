schema: 2
name: gosec
description: Static analyzer for security problems in Go source
homepage: https://github.com/securego/gosec
license: Apache-2.0

versionDiscovery:
  github:
    repo: securego/gosec
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/securego/gosec/releases/download/v{{.Version}}/gosec_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gosec", dst: "bin/gosec", mode: 0o755}

bins: ["bin"]

versions:
