schema: 2
name: kubefwd
description: Bulk port forwarding for Kubernetes services
homepage: https://kubefwd.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: txn2/kubefwd
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/txn2/kubefwd/releases/download/v{{.Version}}/kubefwd_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubefwd", dst: "bin/kubefwd", mode: 0o755}

bins: ["bin"]

