schema: 2
name: vault
description: Secrets management and data protection tool
homepage: https://developer.hashicorp.com/vault
license: BUSL-1.1

versionDiscovery:
  github:
    repo: hashicorp/vault
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://releases.hashicorp.com/vault/{{.Version}}/vault_{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "vault", dst: "bin/vault", mode: 0o755}

bins: ["bin"]

