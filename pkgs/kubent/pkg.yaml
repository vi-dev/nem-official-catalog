schema: 2
name: kubent
description: Checks Kubernetes clusters for deprecated API usage
homepage: https://github.com/doitintl/kube-no-trouble
license: MIT

versionDiscovery:
  github:
    repo: doitintl/kube-no-trouble
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/doitintl/kube-no-trouble/releases/download/{{.Version}}/kubent-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubent", dst: "bin/kubent", mode: 0o755}

bins: ["bin"]

