schema: 2
name: kubectl-slice
description: Split multi-document Kubernetes YAML into files
homepage: https://github.com/patrickdappollonio/kubectl-slice
license: MIT

versionDiscovery:
  github:
    repo: patrickdappollonio/kubectl-slice
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/patrickdappollonio/kubectl-slice/releases/download/v{{.Version}}/kubectl-slice_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-slice", dst: "bin/kubectl-slice", mode: 0o755}

bins: ["bin"]

versions:
  - version: 1.4.2
    sha256:
      darwin/arm64: "46dbfdb8635a015b9352d78b8865fd19ca10fd30933dc74ffbd208ace371033e"
