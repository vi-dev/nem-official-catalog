schema: 2
name: templ
description: HTML templating language for Go with a code generator
homepage: https://templ.guide
license: MIT

versionDiscovery:
  github:
    repo: a-h/templ
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/a-h/templ/releases/download/v{{.Version}}/templ_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "templ", dst: "bin/templ", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.3.1020
    sha256:
      darwin/arm64: "f391943e3e49ece301f90c2283c7f9e629081f18b0b3ab6b48cb4b87ad94b206"
      darwin/amd64: "f1522f2558081335584fd4fb67d329d02a9ae6e83dd88b14cae1ad84c770e5c0"
      linux/arm64: "8d38728fa82c0ee568d2ae1ce0720963402d384dd59d4c76bcdbb38d581c815c"
      linux/amd64: "d1e726e8e78a6cf7e1e72ce3746f30fd94ec0eba10be1abab02208a41efc9aa5"
