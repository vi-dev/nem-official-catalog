schema: 2
name: nushell
description: Shell with structured data pipelines
homepage: https://www.nushell.sh
license: MIT

versionDiscovery:
  github:
    repo: nushell/nushell
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/nushell/nushell/releases/download/{{.Version}}/nu-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "nu", dst: "bin/nu", mode: 0o755}

bins: ["bin"]

