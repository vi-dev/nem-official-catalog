schema: 2
name: zoxide
description: Smarter cd command that learns your habits
homepage: https://github.com/ajeetdsouza/zoxide
license: MIT

versionDiscovery:
  github:
    repo: ajeetdsouza/zoxide
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ajeetdsouza/zoxide/releases/download/v{{.Version}}/zoxide-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "zoxide", dst: "bin/zoxide", mode: 0o755}

bins: ["bin"]

versions:
