schema: 2
name: protoc-gen-go
description: protoc plugin generating Go code from Protocol Buffers
homepage: https://github.com/protocolbuffers/protobuf-go
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: protocolbuffers/protobuf-go
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/protocolbuffers/protobuf-go/releases/download/v{{.Version}}/protoc-gen-go.v{{.Version}}.{{.OS}}.{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "protoc-gen-go", dst: "bin/protoc-gen-go", mode: 0o755}

bins: ["bin"]

versions:
