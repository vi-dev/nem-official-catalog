schema: 2
name: gdu
description: Fast disk usage analyzer with a console interface
homepage: https://github.com/dundee/gdu
license: MIT

versionDiscovery:
  github:
    repo: dundee/gdu
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/dundee/gdu/releases/download/v{{.Version}}/gdu_{{.OS}}_{{.Arch}}.tgz"

install:
  - extract: {strip: 0}
  - copy: {src: "gdu_{{.OS}}_{{.Arch}}", dst: "bin/gdu", mode: 0o755}

bins: ["bin"]

