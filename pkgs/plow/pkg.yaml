schema: 2
name: plow
description: HTTP benchmarking tool with terminal and web UI
homepage: https://github.com/six-ddc/plow
license: Apache-2.0

versionDiscovery:
  github:
    repo: six-ddc/plow
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/six-ddc/plow/releases/download/v{{.Version}}/plow_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "plow", dst: "bin/plow", mode: 0o755}

bins: ["bin"]

