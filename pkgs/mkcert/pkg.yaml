schema: 2
name: mkcert
description: Locally-trusted development TLS certificates
homepage: https://mkcert.dev
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: FiloSottile/mkcert
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/FiloSottile/mkcert/releases/download/v{{.Version}}/mkcert-v{{.Version}}-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/mkcert", mode: 0o755}

bins: ["bin"]

