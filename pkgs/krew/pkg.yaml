schema: 2
name: krew
description: Kubectl plugin manager
homepage: https://krew.sigs.k8s.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubernetes-sigs/krew
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubernetes-sigs/krew/releases/download/v{{.Version}}/krew-{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  # installed as kubectl-krew so kubectl discovers it as a plugin
  - copy: {src: "krew-{{.OS}}_{{.Arch}}", dst: "bin/kubectl-krew", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.5.0
    sha256:
      darwin/arm64: "cd6e58b4e954e301abd19001d772846997216d696bcaa58f0bcf04708339ece3"
