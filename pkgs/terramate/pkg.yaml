schema: 2
name: terramate
description: Orchestration and code generation for Terraform
homepage: https://terramate.io
license: MPL-2.0

versionDiscovery:
  github:
    repo: terramate-io/terramate
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/terramate-io/terramate/releases/download/v{{.Version}}/terramate_{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "terramate", dst: "bin/terramate", mode: 0o755}

bins: ["bin"]

