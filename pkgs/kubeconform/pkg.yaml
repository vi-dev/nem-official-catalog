schema: 2
name: kubeconform
description: Kubernetes manifest validator
homepage: https://github.com/yannh/kubeconform
license: Apache-2.0

versionDiscovery:
  github:
    repo: yannh/kubeconform
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/yannh/kubeconform/releases/download/v{{.Version}}/kubeconform-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubeconform", dst: "bin/kubeconform", mode: 0o755}

bins: ["bin"]

