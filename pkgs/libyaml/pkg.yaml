schema: 2

name: libyaml
description: C library for YAML 1.1 parsing and emitting
homepage: https://pyyaml.org/wiki/LibYAML
license: MIT

platforms: [darwin/arm64, linux/arm64, linux/amd64]

libs: [lib]

versionDiscovery:
  http:
    url: https://pyyaml.org/download/libyaml/
    filter: 'yaml-(\d+\.\d+\.\d+)\.tar\.gz'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 0.2.5
    sourceSha256: "c642ae9b75fee120b2d96c712538bd2cf283228d2337df2cf2988e3c02678ef4"

build:
  source:
    url: 'https://pyyaml.org/download/libyaml/yaml-{{.Version}}.tar.gz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --libdir=/lib --disable-static --disable-dependency-tracking
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
        rm -f "$NEM_OUTPUT/lib/"*.la
