schema: 2
name: atlantis
description: Terraform pull request automation server
homepage: https://www.runatlantis.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: runatlantis/atlantis
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/runatlantis/atlantis/releases/download/v{{.Version}}/atlantis_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "atlantis", dst: "bin/atlantis", mode: 0o755}

bins: ["bin"]

