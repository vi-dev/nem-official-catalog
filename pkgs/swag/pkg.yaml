schema: 2
name: swag
description: Swagger 2.0 documentation generator for annotated Go code
homepage: https://github.com/swaggo/swag
license: MIT

versionDiscovery:
  github:
    repo: swaggo/swag
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/swaggo/swag/releases/download/v{{.Version}}/swag_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "swag", dst: "bin/swag", mode: 0o755}

bins: ["bin"]

versions:
