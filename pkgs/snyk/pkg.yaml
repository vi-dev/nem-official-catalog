schema: 2
name: snyk
description: Security scanner for code, dependencies, and containers
homepage: https://docs.snyk.io/snyk-cli
license: Apache-2.0

versionDiscovery:
  github:
    repo: snyk/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/snyk/cli/releases/download/v{{.Version}}/snyk-{{replace .OS \"darwin\" \"macos\"}}{{if eq .Arch \"arm64\"}}-arm64{{end}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/snyk", mode: 0o755}

bins: ["bin"]

