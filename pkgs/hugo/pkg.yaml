schema: 2
name: hugo
description: Hugo static site generator (extended, withdeploy)
homepage: https://gohugo.io
license: Apache-2.0

platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: gohugoio/hugo
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

bins: [bin]

versions:
  - version: 0.165.0
    sourceSha256: "e9c1e7d8e6e09356cc56317fd01b7493d712692390b89b3d33810cfe1305650e"

build:
  deps:
    - go
  source:
    url: 'https://github.com/gohugoio/hugo/archive/refs/tags/v{{.Version}}.tar.gz'
  output: out
  steps:
    # The extended build compiles the embedded libsass C++ sources via cgo,
    # which defaults off on some builders (e.g. linux/arm64), so force it on.
    - run: CGO_ENABLED=1 go build -trimpath -tags extended,withdeploy -ldflags "-s -w -X github.com/gohugoio/hugo/common/hugo.vendorInfo=nem" -o "$NEM_OUTPUT/bin/hugo" .
