schema: 2
name: bore
description: TCP tunnel exposing local ports to a remote server
homepage: https://github.com/ekzhang/bore
license: MIT

versionDiscovery:
  github:
    repo: ekzhang/bore
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ekzhang/bore/releases/download/v{{.Version}}/bore-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "bore", dst: "bin/bore", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.6.0
    sha256:
      darwin/arm64: "65f43a67b90874700538bdb6064c5e92276e64dfba24f5cd72ef24a035eec3bc"
