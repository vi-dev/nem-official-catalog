schema: 2
name: distribution
description: Registry server for storing and distributing container images
homepage: https://distribution.github.io/distribution
license: Apache-2.0

platforms: [linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: distribution/distribution
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/distribution/distribution/releases/download/v{{.Version}}/registry_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "registry", dst: "bin/registry", mode: 0o755}

bins: ["bin"]

versions:
  - version: 3.1.1
    sha256:
      linux/arm64: "8167316d2b4a57e10d44f8c8a3c75fea5f3ec1c71872760bb903e5e8e52e9ad6"
      linux/amd64: "6f330a3ba9ea1d23a6ee189f449d792595240585bb2f159123d76ac594f70dd8"
