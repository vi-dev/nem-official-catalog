schema: 2
name: superfile
description: Modern terminal file manager
homepage: https://github.com/yorukot/superfile
license: MIT

versionDiscovery:
  github:
    repo: yorukot/superfile
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/yorukot/superfile/releases/download/v{{.Version}}/superfile-{{.OS}}-v{{.Version}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 3}
  - copy: {src: "spf", dst: "bin/spf", mode: 0o755}

bins: ["bin"]

