schema: 2
name: television
description: General-purpose fuzzy finder TUI
homepage: https://github.com/alexpasmantier/television
license: MIT

versionDiscovery:
  github:
    repo: alexpasmantier/television
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/alexpasmantier/television/releases/download/{{.Version}}/tv-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "tv", dst: "bin/tv", mode: 0o755}

bins: ["bin"]

