schema: 2
name: infracost
description: Cloud cost estimates for Terraform
homepage: https://www.infracost.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: infracost/infracost
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/infracost/infracost/releases/download/v{{.Version}}/infracost-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "infracost-{{.OS}}-{{.Arch}}", dst: "bin/infracost", mode: 0o755}

bins: ["bin"]

