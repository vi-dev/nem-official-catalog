schema: 2
name: btop
description: Resource monitor for CPU, memory, disks, and network
homepage: https://github.com/aristocratos/btop
license: Apache-2.0

platforms: [linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: aristocratos/btop
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/aristocratos/btop/releases/download/v{{.Version}}/btop-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-unknown-linux-musl.tar.gz"

# Entries are "./btop/bin/btop" and the leading "./" counts as a stripped
# component, so reaching "bin/btop" takes two, not one.
install:
  - extract: {strip: 2}

bins: ["bin"]

versions:
  - version: 1.4.7
    sha256:
      linux/arm64: "6270de0ef4c84cf0eea61cb148b3ad9ae91a11e9c3309867ffc6b3751024c252"
      linux/amd64: "5099054dd6a101bd12eb6ff3702a9a6a3f57aaa27923a0da478ae5b517faf335"

test:
  - run: btop --version | grep -q "$NEM_VERSION"
