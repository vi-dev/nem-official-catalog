schema: 2
name: stylua
description: Code formatter for Lua
homepage: https://github.com/JohnnyMorganz/StyLua
license: MPL-2.0

versionDiscovery:
  github:
    repo: JohnnyMorganz/StyLua
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/JohnnyMorganz/StyLua/releases/download/v{{.Version}}/stylua-{{replace .OS \"darwin\" \"macos\"}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "stylua", dst: "bin/stylua", mode: 0o755}

bins: ["bin"]

