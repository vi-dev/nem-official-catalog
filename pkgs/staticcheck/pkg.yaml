schema: 2
name: staticcheck
description: Static analysis linter for Go
homepage: https://staticcheck.dev
license: MIT

versionDiscovery:
  github:
    repo: dominikh/go-tools
    # releases use calendar versions (2026.1); v0.x tags are library tags
    filter: '^\d{4}\.\d+(\.\d+)?$'

artifact:
  url: "https://github.com/dominikh/go-tools/releases/download/{{.Version}}/staticcheck_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "staticcheck", dst: "bin/staticcheck", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2026.1
    sha256:
      darwin/arm64: "f71553886fe4bb313da317d7abc3e16fe3cae2dba54f1e07a94a1ae160beced2"
