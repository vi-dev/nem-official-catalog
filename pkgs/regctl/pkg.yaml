schema: 2
name: regctl
description: Registry client for inspecting and copying OCI images
homepage: https://github.com/regclient/regclient
license: Apache-2.0

versionDiscovery:
  github:
    repo: regclient/regclient
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/regclient/regclient/releases/download/v{{.Version}}/regctl-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/regctl", mode: 0o755}

bins: ["bin"]

