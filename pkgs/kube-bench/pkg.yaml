schema: 2
name: kube-bench
description: Checks Kubernetes against the CIS Kubernetes Benchmark
homepage: https://github.com/aquasecurity/kube-bench
license: Apache-2.0

versionDiscovery:
  github:
    repo: aquasecurity/kube-bench
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/aquasecurity/kube-bench/releases/download/v{{.Version}}/kube-bench_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kube-bench", dst: "bin/kube-bench", mode: 0o755}

bins: ["bin"]

