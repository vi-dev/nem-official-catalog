schema: 2
name: ty
description: Python type checker and language server
homepage: https://github.com/astral-sh/ty
license: MIT

versionDiscovery:
  github:
    repo: astral-sh/ty
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/astral-sh/ty/releases/download/{{.Version}}/ty-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "ty", dst: "bin/ty", mode: 0o755}

bins: ["bin"]

