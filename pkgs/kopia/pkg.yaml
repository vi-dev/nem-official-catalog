schema: 2
name: kopia
description: Encrypted, deduplicating backup tool
homepage: https://kopia.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kopia/kopia
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kopia/kopia/releases/download/v{{.Version}}/kopia-{{.Version}}-{{replace .OS \"darwin\" \"macOS\"}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "kopia", dst: "bin/kopia", mode: 0o755}

bins: ["bin"]

