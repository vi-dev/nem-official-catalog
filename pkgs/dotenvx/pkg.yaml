schema: 2
name: dotenvx
description: Encrypted .env loader and secrets manager
homepage: https://dotenvx.com
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: dotenvx/dotenvx
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/dotenvx/dotenvx/releases/download/v{{.Version}}/dotenvx-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "dotenvx", dst: "bin/dotenvx", mode: 0o755}

bins: ["bin"]

