schema: 2
name: jd
description: Diff and patch tool for JSON and YAML
homepage: https://github.com/josephburnett/jd
license: MIT

versionDiscovery:
  github:
    repo: josephburnett/jd
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/josephburnett/jd/releases/download/v{{.Version}}/jd-{{.Arch}}-{{.OS}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/jd", mode: 0o755}

bins: ["bin"]

