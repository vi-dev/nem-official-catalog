schema: 2

name: ncurses
description: Terminal control library (wide-character) with tic, tput, and infocmp
homepage: https://invisible-island.net/ncurses/
license: MIT-open-group

platforms: [darwin/arm64, linux/arm64, linux/amd64]

bins: [bin]
libs: [lib]

# The trailing colon appends the compiled-in search list (system terminfo
# dirs) after this package's own database.
env:
  - name: TERMINFO_DIRS
    value: "{{.InstallDir}}/share/terminfo:"

versionDiscovery:
  http:
    url: https://ftp.gnu.org/gnu/ncurses/
    filter: 'ncurses-(\d+\.\d+)\.tar\.gz'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 6.6
    sourceSha256: "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"

build:
  source:
    url: 'https://ftp.gnu.org/gnu/ncurses/ncurses-{{.Version}}.tar.gz'
  output: out
  steps:
    # No package-absolute path can be baked, so the compiled-in terminfo
    # search list points at the usual system locations.
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --libdir=/lib --with-shared --without-normal --without-debug \
          --without-ada --without-cxx-binding --without-tests \
          --enable-widec --enable-overwrite \
          --enable-pc-files --with-pkg-config-libdir=/lib/pkgconfig \
          --with-terminfo-dirs="/usr/share/terminfo:/lib/terminfo:/etc/terminfo" \
          --with-default-terminfo-dir=/share/terminfo
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
        # Archive extraction rejects the absolute lib/terminfo symlink target.
        ln -sfn ../share/terminfo "$NEM_OUTPUT/lib/terminfo"
        # Unsuffixed aliases so -lncurses/-lform/... and pkg-config queries
        # against the plain names resolve to the widec build.
        cd "$NEM_OUTPUT/lib"
        for l in ncurses form panel menu; do
          for f in lib${l}w.*; do
            ln -sf "$f" "$(printf %s "$f" | sed "s/${l}w/${l}/")"
          done
          [ -f "pkgconfig/${l}w.pc" ] && ln -sf "${l}w.pc" "pkgconfig/${l}.pc"
        done
