schema: 2
name: mage
description: Make-like build tool using Go
homepage: https://magefile.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: magefile/mage
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/magefile/mage/releases/download/v{{.Version}}/mage_{{.Version}}_{{replace (replace .OS \"darwin\" \"macOS\") \"linux\" \"Linux\"}}-{{replace (replace .Arch \"arm64\" \"ARM64\") \"amd64\" \"64bit\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "mage", dst: "bin/mage", mode: 0o755}

bins: ["bin"]

versions:
