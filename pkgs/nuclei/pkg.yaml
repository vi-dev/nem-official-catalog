schema: 2
name: nuclei
description: Vulnerability scanner driven by YAML templates
homepage: https://github.com/projectdiscovery/nuclei
license: MIT

versionDiscovery:
  github:
    repo: projectdiscovery/nuclei
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/projectdiscovery/nuclei/releases/download/v{{.Version}}/nuclei_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "nuclei", dst: "bin/nuclei", mode: 0o755}

bins: ["bin"]

versions:
