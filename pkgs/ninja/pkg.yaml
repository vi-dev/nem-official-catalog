schema: 2
name: ninja
description: Small build system focused on speed
homepage: https://ninja-build.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: ninja-build/ninja
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ninja-build/ninja/releases/download/v{{.Version}}/ninja-{{if eq .OS \"darwin\"}}mac{{else}}linux{{if eq .Arch \"arm64\"}}-aarch64{{end}}{{end}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "ninja", dst: "bin/ninja", mode: 0o755}

bins: ["bin"]

versions:
