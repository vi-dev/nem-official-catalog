schema: 2
name: f2
description: Batch rename files and directories from the command line
homepage: https://github.com/ayoisaiah/f2
license: MIT

versionDiscovery:
  github:
    repo: ayoisaiah/f2
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ayoisaiah/f2/releases/download/v{{.Version}}/f2_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "f2", dst: "bin/f2", mode: 0o755}

bins: ["bin"]

