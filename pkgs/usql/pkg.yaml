schema: 2
name: usql
description: Universal SQL client for many databases
homepage: https://github.com/xo/usql
license: MIT

versionDiscovery:
  github:
    repo: xo/usql
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/xo/usql/releases/download/v{{.Version}}/usql-{{.Version}}-{{.OS}}-{{.Arch}}.tar.bz2"

install:
  - extract: {strip: 0}
  - copy: {src: "usql", dst: "bin/usql", mode: 0o755}

bins: ["bin"]

