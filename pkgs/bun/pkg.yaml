schema: 2
name: bun
description: All-in-one JavaScript runtime, bundler, and package manager
homepage: https://bun.com
license: MIT

versionDiscovery:
  github:
    repo: oven-sh/bun
    filter: '^bun-v\d+\.\d+\.\d+$'
    prefix: "bun-v"

artifact:
  url: "https://github.com/oven-sh/bun/releases/download/bun-v{{.Version}}/bun-{{.OS}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x64\"}}.zip"

# The zip nests a single self-contained binary under a per-platform dir;
# stripping it leaves just the bun executable at the install root.
install:
  - extract: {strip: 1}

bins: ["."]

