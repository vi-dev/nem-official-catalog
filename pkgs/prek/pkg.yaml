schema: 2
name: prek
description: Drop-in pre-commit replacement written in Rust
homepage: https://prek.j178.dev
license: MIT

versionDiscovery:
  github:
    repo: j178/prek
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/j178/prek/releases/download/v{{.Version}}/prek-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "prek", dst: "bin/prek", mode: 0o755}

bins: ["bin"]

