schema: 2
name: protoc-gen-grpc-gateway
description: protoc plugin generating a RESTful reverse proxy for gRPC
homepage: https://grpc-ecosystem.github.io/grpc-gateway/
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: grpc-ecosystem/grpc-gateway
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/grpc-ecosystem/grpc-gateway/releases/download/v{{.Version}}/protoc-gen-grpc-gateway-v{{.Version}}-{{.OS}}-{{replace .Arch \"amd64\" \"x86_64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/protoc-gen-grpc-gateway", mode: 0o755}

bins: ["bin"]

