schema: 2
name: pulumi
description: Infrastructure as code in general-purpose languages
homepage: https://www.pulumi.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: pulumi/pulumi
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pulumi/pulumi/releases/download/v{{.Version}}/pulumi-v{{.Version}}-{{.OS}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

install:
  # the tarball nests every binary under pulumi/, exposed directly
  - extract: {strip: 0}

bins: ["pulumi"]

