schema: 2
name: kubectl-node-shell
description: Open a root shell on a Kubernetes node
homepage: https://github.com/kvaps/kubectl-node-shell
license: Apache-2.0

versionDiscovery:
  github:
    repo: kvaps/kubectl-node-shell
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://raw.githubusercontent.com/kvaps/kubectl-node-shell/v{{.Version}}/kubectl-node_shell"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kubectl-node_shell", mode: 0o755}

bins: ["bin"]

