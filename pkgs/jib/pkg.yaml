schema: 2
name: jib
description: Build container images for Java applications without a Docker daemon
homepage: https://github.com/GoogleContainerTools/jib
license: Apache-2.0

deps:
  - jdk25

versionDiscovery:
  github:
    repo: GoogleContainerTools/jib
    filter: '^v\d+\.\d+\.\d+-cli$'
    prefix: "v"
    suffix: "-cli"

artifact:
  url: "https://github.com/GoogleContainerTools/jib/releases/download/v{{.Version}}-cli/jib-jre-{{.Version}}.zip"

install:
  - extract: {strip: 1}

bins: ["bin"]

versions:
