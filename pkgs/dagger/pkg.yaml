schema: 2
name: dagger
description: Programmable CI/CD engine running pipelines in containers
homepage: https://dagger.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: dagger/dagger
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/dagger/dagger/releases/download/v{{.Version}}/dagger_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "dagger", dst: "bin/dagger", mode: 0o755}

bins: ["bin"]

