schema: 2
name: opa
description: Open Policy Agent, a general-purpose policy engine
homepage: https://www.openpolicyagent.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: open-policy-agent/opa
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

# Upstream publishes darwin/amd64 only as a dynamic binary and darwin/arm64
# only as _static; the static variant is used everywhere it exists.
artifact:
  url: "https://github.com/open-policy-agent/opa/releases/download/v{{.Version}}/opa_{{.OS}}_{{.Arch}}{{if or (eq .OS \"linux\") (eq .Arch \"arm64\")}}_static{{end}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/opa", mode: 0o755}

bins: ["bin"]

