schema: 2
name: ruff
description: Extremely fast Python linter and code formatter
homepage: https://docs.astral.sh/ruff/
license: MIT

versionDiscovery:
  github:
    repo: astral-sh/ruff
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/astral-sh/ruff/releases/download/{{.Version}}/ruff-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "ruff", dst: "bin/ruff", mode: 0o755}

bins: ["bin"]

