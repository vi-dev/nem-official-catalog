schema: 2
name: csvlens
description: Command line CSV file viewer
homepage: https://github.com/YS-L/csvlens
license: MIT

versionDiscovery:
  github:
    repo: YS-L/csvlens
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/YS-L/csvlens/releases/download/v{{.Version}}/csvlens-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "csvlens", dst: "bin/csvlens", mode: 0o755}

bins: ["bin"]

versions:
