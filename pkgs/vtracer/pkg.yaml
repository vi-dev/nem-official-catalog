schema: 2
name: vtracer
description: Convert raster images to vector graphics
homepage: https://github.com/visioncortex/vtracer
license: MIT

versionDiscovery:
  github:
    repo: visioncortex/vtracer
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/visioncortex/vtracer/releases/download/{{.Version}}/vtracer-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "vtracer", dst: "bin/vtracer", mode: 0o755}

bins: ["bin"]

versions:
