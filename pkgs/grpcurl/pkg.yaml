schema: 2
name: grpcurl
description: Command-line tool for interacting with gRPC servers
homepage: https://github.com/fullstorydev/grpcurl
license: MIT

versionDiscovery:
  github:
    repo: fullstorydev/grpcurl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/fullstorydev/grpcurl/releases/download/v{{.Version}}/grpcurl_{{.Version}}_{{replace .OS \"darwin\" \"osx\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "grpcurl", dst: "bin/grpcurl", mode: 0o755}

bins: ["bin"]

