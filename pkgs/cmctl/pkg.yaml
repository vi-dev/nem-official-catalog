schema: 2
name: cmctl
description: CLI for cert-manager
homepage: https://cert-manager.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: cert-manager/cmctl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cert-manager/cmctl/releases/download/v{{.Version}}/cmctl_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cmctl", dst: "bin/cmctl", mode: 0o755}

bins: ["bin"]

versions:
