schema: 2
name: gh-ost
description: Online schema migration tool for MySQL
homepage: https://github.com/github/gh-ost
license: MIT

versionDiscovery:
  github:
    repo: github/gh-ost
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/github/gh-ost/releases/download/v{{.Version}}/gh-ost-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gh-ost", dst: "bin/gh-ost", mode: 0o755}

bins: ["bin"]

versions:
