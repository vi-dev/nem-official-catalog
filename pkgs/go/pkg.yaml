test:
  - run: go version | grep -q "$NEM_VERSION"
  # GOROOT must name the tree under test; also check that go itself
  # resolves there, not just that the export renders.
  - run: |
      set -e
      test "$(go env GOROOT)" = "$NEM_PREFIX"
      case "$(command -v go)" in
        "$NEM_PREFIX"/*) ;;
        *) exit 1 ;;
      esac
  - run: |
      set -e
      export GOCACHE="$PWD/.gocache"
      printf 'package main\nimport "fmt"\nfunc main(){fmt.Print("ok")}\n' > main.go
      go mod init probe >/dev/null
      [ "$(go run .)" = ok ]
