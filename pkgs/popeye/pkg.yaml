schema: 2
name: popeye
description: Kubernetes cluster resource sanitizer
homepage: https://popeyecli.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: derailed/popeye
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/derailed/popeye/releases/download/v{{.Version}}/popeye_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "popeye", dst: "bin/popeye", mode: 0o755}

bins: ["bin"]

