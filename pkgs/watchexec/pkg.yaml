schema: 2
name: watchexec
description: Runs commands in response to file changes
homepage: https://watchexec.github.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: watchexec/watchexec
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/watchexec/watchexec/releases/download/v{{.Version}}/watchexec-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "watchexec", dst: "bin/watchexec", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2.5.1
    sha256:
      darwin/arm64: "c5e405dd1109940b2510398d2182990c1be59063b94e11d7ace9c7b435cb1df1"
      darwin/amd64: "bb74bf33286ff7f31dd8e763e017fbc0418360d88baefd35bc57d662d28394e2"
      linux/arm64: "c073887583d502fa0b393a8b847bb4460a111b3b0a199d1f70dafd5d89e71a2f"
      linux/amd64: "9efabd08de720c1ee7e57b487fe11904f0966828e76146e2b5ea5deee90626be"
