schema: 2
name: crane
description: Tool for interacting with remote container images and registries
homepage: https://github.com/google/go-containerregistry
license: Apache-2.0

artifact:
  url: "https://github.com/google/go-containerregistry/releases/download/v{{.Version}}/go-containerregistry_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  # tarball also ships gcrane and krane; only crane is packaged
  - copy: {src: "crane", dst: "bin/crane", mode: 0o755}

bins: ["bin"]

