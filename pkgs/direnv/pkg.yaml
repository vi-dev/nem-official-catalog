schema: 2
name: direnv
description: Load and unload environment variables per directory
homepage: https://direnv.net
license: MIT

versionDiscovery:
  github:
    repo: direnv/direnv
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/direnv/direnv/releases/download/v{{.Version}}/direnv.{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/direnv", mode: 0o755}

bins: ["bin"]

