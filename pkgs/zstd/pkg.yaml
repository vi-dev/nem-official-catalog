schema: 2

name: zstd
description: Zstandard fast lossless compression — CLI and libzstd
homepage: https://facebook.github.io/zstd/
license: BSD-3-Clause

platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: facebook/zstd
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

bins: [bin]
libs: [lib]

versions:
  - version: 1.5.7
    sourceSha256: "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"

build:
  source:
    url: 'https://github.com/facebook/zstd/releases/download/v{{.Version}}/zstd-{{.Version}}.tar.gz'
  output: out
  steps:
    - run: make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)" install PREFIX=/ DESTDIR="$NEM_OUTPUT"
