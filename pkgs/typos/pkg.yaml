schema: 2
name: typos
description: Source code spell checker
homepage: https://github.com/crate-ci/typos
license: MIT

versionDiscovery:
  github:
    repo: crate-ci/typos
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/crate-ci/typos/releases/download/v{{.Version}}/typos-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "typos", dst: "bin/typos", mode: 0o755}

bins: ["bin"]

