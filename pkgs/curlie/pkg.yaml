schema: 2
name: curlie
description: Curl frontend with httpie-style output
homepage: https://rs.github.io/curlie
license: MIT

versionDiscovery:
  github:
    repo: rs/curlie
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/rs/curlie/releases/download/v{{.Version}}/curlie_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "curlie", dst: "bin/curlie", mode: 0o755}

bins: ["bin"]

