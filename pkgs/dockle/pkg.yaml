schema: 2
name: dockle
description: Container image linter for security and best practices
homepage: https://github.com/goodwithtech/dockle
license: Apache-2.0

versionDiscovery:
  github:
    repo: goodwithtech/dockle
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/goodwithtech/dockle/releases/download/v{{.Version}}/dockle_{{.Version}}_{{replace (replace .OS \"darwin\" \"macOS\") \"linux\" \"Linux\"}}-{{replace (replace .Arch \"arm64\" \"ARM64\") \"amd64\" \"64bit\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "dockle", dst: "bin/dockle", mode: 0o755}

bins: ["bin"]

