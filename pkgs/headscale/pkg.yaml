schema: 2
name: headscale
description: Self-hosted implementation of the Tailscale control server
homepage: https://headscale.net
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: juanfont/headscale
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/juanfont/headscale/releases/download/v{{.Version}}/headscale_{{.Version}}_{{.OS}}_{{.Arch}}"

install:
