schema: 2
name: codex
description: Coding agent that runs in the terminal
homepage: https://github.com/openai/codex
license: Apache-2.0

versionDiscovery:
  github:
    repo: openai/codex
    filter: '^rust-v\d+\.\d+\.\d+$'
    prefix: "rust-v"

artifact:
  url: "https://github.com/openai/codex/releases/download/rust-v{{.Version}}/codex-package-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

# The archive ships bin/codex alongside sibling codex-path/ and
# codex-resources/ trees it resolves at runtime, so the layout is kept intact.
install:
  - extract: {strip: 0}

bins: ["bin"]

