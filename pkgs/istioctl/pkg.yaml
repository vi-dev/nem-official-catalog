schema: 2
name: istioctl
description: Istio service mesh command-line tool
homepage: https://istio.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: istio/istio
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/istio/istio/releases/download/{{.Version}}/istioctl-{{.Version}}-{{replace .OS \"darwin\" \"osx\"}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "istioctl", dst: "bin/istioctl", mode: 0o755}

bins: ["bin"]

