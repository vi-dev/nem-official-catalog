schema: 2
name: claude-code
description: Agentic coding tool that runs in the terminal
homepage: https://code.claude.com/docs/en/overview
license: LicenseRef-Anthropic-Commercial

versionDiscovery:
  github:
    repo: anthropics/claude-code
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/anthropics/claude-code/releases/download/v{{.Version}}/claude-{{.OS}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "claude", dst: "bin/claude", mode: 0o755}

bins: ["bin"]

